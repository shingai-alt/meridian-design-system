<!doctype html>
<html lang="ja" data-theme="light" data-contrast="standard" data-density="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Tokens are generated from tokens/src/*.json — run `npm run build:tokens` after editing. -->
<link rel="stylesheet" href="tokens/build/tokens.css">
<style>
/* ============ Reset & base ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html[data-theme="light"]{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
body{font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--lh-normal);color:var(--fg);background:var(--bg);font-feature-settings:"cv02","cv03","ss01";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--selection);color:var(--fg)}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
a.btn:hover,a.tb-btn:hover,a.comp-tile:hover{text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;min-inline-size:24px;min-block-size:24px}
input,select,textarea{font:inherit;color:inherit}
code,pre,kbd{font-family:var(--font-mono)}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:var(--focus-w) solid var(--focus-ring);outline-offset:2px;border-radius:var(--radius-2xs)}
:focus{scroll-margin-block:calc(var(--topbar-h) + var(--sp-3)) var(--sp-3)}
img,svg{display:block}
[dir="rtl"] svg[data-directionality="mirror-in-rtl"]{transform:scaleX(-1)}
.vh,.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important;border:0!important}
.skip-link{position:fixed;inset-block-start:var(--sp-2);inset-inline-start:var(--sp-2);z-index:1000;padding:var(--sp-2) var(--sp-3);background:var(--surface-overlay);color:var(--fg);border:1px solid var(--border-strong);border-radius:var(--radius-sm);transform:translateY(calc(-100% - var(--sp-4)))}
.skip-link:focus-visible{transform:none}

/* ============ App shell ============ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.app.nav-collapsed{grid-template-columns:0 1fr}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sidebar-bg);border-right:1px solid var(--border);padding:var(--sp-3) var(--sp-3) var(--sp-6);scrollbar-width:thin;z-index:40}
.app.nav-collapsed .sidebar{display:none}
.sb-logo{display:flex;align-items:center;gap:var(--sp-25);padding:var(--sp-2) var(--sp-2) var(--sp-3);font-weight:650;font-size:14px;letter-spacing:-.01em;color:var(--fg)}
.sb-logo .mark{width:20px;height:20px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--accent));position:relative;flex:none}
.sb-logo .mark::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sb-logo .ver{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--fg-subtle);background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-full);padding:1px 7px;font-family:var(--font-mono)}
.sb-search{display:flex;align-items:center;gap:var(--sp-2);height:var(--ctl-sm);padding:0 var(--sp-2);margin:0 var(--sp-1) var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--fg-subtle);font-size:var(--text-label);cursor:pointer;transition:border-color var(--dur-fast) var(--ease-standard)}
.sb-search:hover{border-color:var(--border-strong)}
.sb-search kbd{margin-left:auto;font-size:10px;color:var(--fg-subtle);background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-2xs);padding:1px 5px}
.sb-group{margin-top:var(--sp-4)}
.sb-group>.hd{display:flex;align-items:center;width:100%;gap:var(--sp-1);padding:var(--sp-1) var(--sp-2);font-size:var(--text-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle)}
.sb-group>.hd svg{transition:transform var(--dur-fast) var(--ease-standard)}
.sb-group.closed>.hd svg{transform:rotate(-90deg)}
.sb-group.closed>.items{display:none}
.sb-item{display:flex;align-items:center;gap:var(--sp-2);width:100%;padding:0 var(--sp-2);height:calc(var(--ctl-sm) - 2px);border-radius:var(--radius-sm);font-size:var(--text-label);color:var(--fg-muted);text-align:left;transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard)}
.sb-item:hover{background:var(--surface-muted);color:var(--fg);text-decoration:none}
.sb-item[aria-current="page"]{background:var(--sidebar-item-active-bg);color:var(--primary);font-weight:550}
.sb-item .nbadge{margin-left:auto;font-size:9.5px;font-weight:600;padding:0 5px;border-radius:var(--radius-full);background:var(--primary-subtle);color:var(--primary)}
.sb-sub{padding-left:var(--sp-3);margin-left:var(--sp-25);border-left:1px solid var(--border-muted)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:var(--sp-2);height:var(--topbar-h);padding:0 var(--sp-5);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.tb-crumb{display:flex;align-items:center;gap:var(--sp-15);font-size:var(--text-label);color:var(--fg-subtle);min-width:0}
.tb-crumb b{color:var(--fg);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--sp-15)}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-15);height:var(--ctl-sm);min-width:var(--ctl-sm);padding:0 var(--sp-2);border-radius:var(--radius-sm);border:1px solid transparent;color:var(--fg-muted);font-size:var(--text-label);transition:all var(--dur-fast) var(--ease-standard)}
.tb-btn:hover{background:var(--surface-muted);color:var(--fg)}
.tb-btn.bordered{border-color:var(--border);background:var(--surface)}
.tb-seed{width:18px;height:18px;border-radius:var(--radius-full);background:var(--primary);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tb-avatar{width:26px;height:26px;border-radius:var(--radius-full);background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600}
.tb-menu{position:absolute;top:calc(var(--topbar-h) - 6px);right:var(--sp-5);width:280px;background:var(--surface-overlay);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--sp-3);z-index:60;animation:pop var(--dur-fast) var(--ease-enter)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.tb-menu h4{font-size:var(--text-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);margin:var(--sp-2) 0 var(--sp-15)}
.tb-menu h4:first-child{margin-top:0}

/* content */
.content{flex:1;width:100%}
.doc-wrap{display:grid;grid-template-columns:minmax(0,1fr) var(--toc-w);gap:var(--sp-10);max-width:calc(var(--content-max) + var(--toc-w) + var(--sp-10));margin:0 auto;padding:var(--page-pad-block) var(--page-pad-inline) var(--sp-20)}
.doc-wrap.no-toc{grid-template-columns:minmax(0,1fr);max-width:var(--content-max)}
.doc-wrap.wide{max-width:var(--content-wide);grid-template-columns:minmax(0,1fr)}
.toc{position:sticky;top:calc(var(--topbar-h) + var(--sp-6));align-self:start;font-size:var(--text-small)}
.toc .t{font-size:var(--text-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:var(--sp-2)}
.toc a{display:block;padding:3px 0 3px var(--sp-25);color:var(--fg-muted);border-left:1.5px solid var(--border-muted)}
.toc a:hover{color:var(--fg);text-decoration:none}
.toc a.on{color:var(--primary);border-left-color:var(--primary);font-weight:550}

/* doc typography */
.doc .eyebrow{font-size:var(--text-micro);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:var(--sp-2)}
.doc h1{font-size:28px;font-weight:650;letter-spacing:-.022em;line-height:1.2;margin-bottom:var(--sp-3)}
.doc .lead{font-size:15px;color:var(--fg-muted);max-width:var(--reading-max);margin-bottom:var(--sp-6)}
.doc h2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:var(--sp-10) 0 var(--sp-3);padding-top:var(--sp-4);border-top:1px solid var(--border-muted);scroll-margin-top:calc(var(--topbar-h) + var(--sp-4))}
.doc h2:first-of-type{border-top:none;padding-top:0}
.doc h3{font-size:15px;font-weight:600;margin:var(--sp-6) 0 var(--sp-2)}
.doc h4{font-size:var(--text-body);font-weight:600;margin:var(--sp-4) 0 var(--sp-15)}
.doc p{margin-bottom:var(--sp-3);max-width:var(--reading-max);color:var(--fg)}
.doc p.muted{color:var(--fg-muted)}
.doc ul.plain,.doc ol.plain{margin:0 0 var(--sp-3) var(--sp-5);max-width:var(--reading-max)}
.doc ul.plain li{margin-bottom:var(--sp-1);color:var(--fg)}
.doc hr{border:none;border-top:1px solid var(--border-muted);margin:var(--sp-8) 0}
.doc .callout{display:flex;gap:var(--sp-25);padding:var(--sp-3) var(--sp-4);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-muted);font-size:var(--text-label);color:var(--fg-muted);max-width:var(--reading-max);margin-bottom:var(--sp-4)}
.doc .callout.info{border-color:color-mix(in srgb,var(--info) 30%,var(--border));background:var(--info-subtle);color:var(--fg)}
.doc .callout.warn{border-color:color-mix(in srgb,var(--warning) 40%,var(--border));background:var(--warning-subtle);color:var(--fg)}
.doc code.inline{font-size:.86em;background:var(--surface-muted);border:1px solid var(--border-muted);border-radius:var(--radius-2xs);padding:1px 5px;color:var(--fg)}

/* generic surfaces */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
.panel.pad{padding:var(--card-pad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-4)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3)}
@media(max-width:900px){.grid3,.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.rowflex{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}

/* code block */
.codeblock{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin:var(--sp-3) 0;font-size:12.5px}
.codeblock .cb-hd{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-15) var(--sp-3);border-bottom:1px solid var(--border);color:var(--fg-subtle);font-size:var(--text-micro);font-family:var(--font-mono)}
.codeblock .cb-hd .cp{margin-left:auto}
.codeblock pre{padding:var(--sp-3) var(--sp-4);overflow-x:auto;line-height:1.6;color:var(--fg);tab-size:2}
.codeblock .tk-k{color:var(--code-k)}.codeblock .tk-s{color:var(--code-s)}.codeblock .tk-c{color:var(--fg-subtle);font-style:italic}.codeblock .tk-f{color:var(--code-f)}.codeblock .tk-n{color:var(--code-n)}.codeblock .tk-p{color:var(--fg-muted)}
.cp{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-micro);color:var(--fg-subtle);border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-2xs);padding:2px 7px;transition:all var(--dur-fast) var(--ease-standard)}
.cp:hover{color:var(--fg);border-color:var(--border-strong)}
.cp.ok{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,var(--border))}

/* token tables */
.ttable{width:100%;border-collapse:collapse;font-size:var(--text-label)}
.ttable th{text-align:left;font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-subtle);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border)}
.ttable td{padding:var(--cell-y) var(--sp-3);border-bottom:1px solid var(--border-muted);vertical-align:middle}
.ttable tr:hover td{background:var(--table-row-hover)}
.ttable .mono{font-family:var(--font-mono);font-size:.92em}
.ttable .swpair{display:flex;align-items:center;gap:var(--sp-2)}
.sw{width:18px;height:18px;border-radius:var(--radius-xs);border:1px solid var(--border);flex:none}
.tscroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.tscroll .ttable td:first-child,.tscroll .ttable th:first-child{padding-left:var(--sp-4)}

/* palette strips */
.pal{display:grid;grid-template-columns:110px repeat(11,1fr);align-items:center;gap:4px;margin-bottom:6px}
.pal .nm{font-size:var(--text-small);font-family:var(--font-mono);color:var(--fg-muted)}
.pal .cell{height:34px;border-radius:var(--radius-xs);position:relative;cursor:pointer;border:1px solid rgba(0,0,0,.06)}
.pal .cell span{position:absolute;left:5px;bottom:3px;font-size:9px;font-family:var(--font-mono);opacity:.85}
@media(max-width:800px){.pal{grid-template-columns:80px repeat(11,1fr)}.pal .cell span{display:none}}

/* ============ Component library ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-15);font-weight:550;border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard);position:relative;user-select:none}
.btn[data-size="xs"]{height:var(--ctl-xs);padding:0 var(--sp-2);font-size:var(--text-micro);gap:var(--sp-1)}
.btn[data-size="sm"]{height:var(--ctl-sm);padding:0 var(--sp-25);font-size:var(--text-small);gap:var(--sp-15)}
.btn[data-size="md"]{height:var(--ctl-md);padding:0 var(--sp-3);font-size:var(--text-label);gap:var(--sp-2)}
.btn[data-size="lg"]{height:var(--ctl-lg);padding:0 var(--sp-4);font-size:var(--text-body);gap:var(--sp-2)}
.btn[data-size="xl"]{height:var(--ctl-xl);padding:0 var(--sp-5);font-size:var(--text-body);gap:var(--sp-25)}
.btn>svg{flex:none}
.btn[data-size="xs"]>svg,.btn[data-size="xs"] .spinner{width:var(--button-icon-size-xs);height:var(--button-icon-size-xs)}
.btn[data-size="sm"]>svg,.btn[data-size="sm"] .spinner{width:var(--button-icon-size-sm);height:var(--button-icon-size-sm)}
.btn[data-size="md"]>svg,.btn[data-size="md"] .spinner{width:var(--button-icon-size-md);height:var(--button-icon-size-md)}
.btn[data-size="lg"]>svg,.btn[data-size="lg"] .spinner{width:var(--button-icon-size-lg);height:var(--button-icon-size-lg)}
.btn[data-size="xl"]>svg,.btn[data-size="xl"] .spinner{width:var(--button-icon-size-xl);height:var(--button-icon-size-xl)}
.btn[data-icononly]{padding:0;aspect-ratio:1;width:auto}
.btn[data-component="icon-button"]{padding:0;gap:0;width:var(--ctl-md)}
.btn[data-component="icon-button"][data-size="xs"]{width:var(--ctl-xs)}
.btn[data-component="icon-button"][data-size="sm"]{width:var(--ctl-sm)}
.btn[data-component="icon-button"][data-size="md"]{width:var(--ctl-md)}
.btn[data-component="icon-button"][data-size="lg"]{width:var(--ctl-lg)}
.btn[data-component="icon-button"][data-size="xl"]{width:var(--ctl-xl)}
.btn[data-component="icon-button"][data-size="xs"]>svg,.btn[data-component="icon-button"][data-size="xs"] .spinner{width:var(--icon-button-icon-size-xs);height:var(--icon-button-icon-size-xs)}
.btn[data-component="icon-button"][data-size="sm"]>svg,.btn[data-component="icon-button"][data-size="sm"] .spinner{width:var(--icon-button-icon-size-sm);height:var(--icon-button-icon-size-sm)}
.btn[data-component="icon-button"][data-size="md"]>svg,.btn[data-component="icon-button"][data-size="md"] .spinner{width:var(--icon-button-icon-size-md);height:var(--icon-button-icon-size-md)}
.btn[data-component="icon-button"][data-size="lg"]>svg,.btn[data-component="icon-button"][data-size="lg"] .spinner{width:var(--icon-button-icon-size-lg);height:var(--icon-button-icon-size-lg)}
.btn[data-component="icon-button"][data-size="xl"]>svg,.btn[data-component="icon-button"][data-size="xl"] .spinner{width:var(--icon-button-icon-size-xl);height:var(--icon-button-icon-size-xl)}
.icon-button-wrap{position:relative;display:inline-flex}
.icon-button-tooltip{position:absolute;z-index:10;inset-block-end:calc(100% + var(--sp-2));inset-inline-start:50%;translate:-50% 0;padding:var(--sp-1) var(--sp-2);border-radius:var(--radius-xs);background:var(--tooltip-bg);color:var(--bg);font-size:var(--text-micro);line-height:1.4;white-space:nowrap;box-shadow:var(--shadow-md);opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--dur-fast) var(--ease-standard)}
.icon-btn:hover+.icon-button-tooltip,.icon-btn:focus-visible+.icon-button-tooltip,.icon-btn.sim-hover+.icon-button-tooltip,.icon-btn.sim-focus+.icon-button-tooltip{opacity:1;visibility:visible}
.btn[data-variant="primary"]{background:var(--button-primary-bg);color:var(--button-primary-fg)}
.btn[data-variant="primary"]:hover{background:var(--button-primary-bg-hover)}
.btn[data-variant="primary"]:active{background:var(--button-primary-bg-active)}
.btn[data-variant="primary"].sim-hover{background:var(--button-primary-bg-hover)}
.btn[data-variant="primary"].sim-active{background:var(--button-primary-bg-active)}
.btn[data-variant="secondary"]{background:var(--control-bg);border-color:var(--control-border);color:var(--fg)}
.btn[data-variant="secondary"]:hover{border-color:var(--control-border-hover);background:var(--control-bg-hover)}
.btn[data-variant="secondary"]:active{border-color:var(--control-border-hover);background:var(--control-bg-active)}
.btn[data-variant="secondary"].sim-hover{border-color:var(--control-border-hover);background:var(--control-bg-hover)}
.btn[data-variant="secondary"].sim-active{border-color:var(--control-border-hover);background:var(--control-bg-active)}
.btn[data-variant="tertiary"]{background:var(--primary-subtle);color:var(--primary)}
.btn[data-variant="tertiary"]:hover{background:var(--primary-muted)}
.btn[data-variant="tertiary"]:active{background:var(--primary-muted)}
.btn[data-variant="tertiary"].sim-hover,.btn[data-variant="tertiary"].sim-active{background:var(--primary-muted)}
.btn[data-variant="ghost"]{color:var(--fg)}
.btn[data-variant="ghost"]:hover{background:var(--surface-muted);color:var(--fg)}
.btn[data-variant="ghost"]:active{background:var(--control-bg-active);color:var(--fg)}
.btn[data-variant="ghost"].sim-hover{background:var(--surface-muted);color:var(--fg)}
.btn[data-variant="ghost"].sim-active{background:var(--control-bg-active);color:var(--fg)}
.btn[data-variant="danger"]{background:var(--danger);color:var(--danger-on-solid)}
.btn[data-variant="danger"]:hover{background:var(--danger-hover)}
.btn[data-variant="danger"]:active{background:var(--danger-active)}
.btn[data-variant="danger"].sim-hover{background:var(--danger-hover)}
.btn[data-variant="danger"].sim-active{background:var(--danger-active)}
.btn.sim-hover,.btn.sim-active{filter:none}
.btn:focus-visible{border-radius:var(--radius-sm)}
.btn:disabled{cursor:not-allowed;pointer-events:none}
.btn[data-variant="primary"]:disabled,.btn[data-variant="danger"]:disabled{background:var(--disabled);color:var(--fg-disabled)}
.btn[data-variant="secondary"]:disabled{background:var(--control-bg);border-color:var(--control-border);color:var(--fg-disabled)}
.btn[data-variant="tertiary"]:disabled{background:var(--surface-muted);color:var(--fg-disabled)}
.btn[data-variant="ghost"]:disabled{background:transparent;color:var(--fg-disabled)}
.btn[data-loading]{color:transparent!important;cursor:progress;pointer-events:none}
.btn[data-loading] .btnspin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.btn[data-variant="primary"][data-loading] .btnspin{color:var(--button-primary-fg)}
.btn[data-variant="danger"][data-loading] .btnspin{color:var(--danger-on-solid)}
.btn[data-full]{width:100%}
.spinner{width:1em;height:1em;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin var(--dur-loop) linear infinite;display:inline-block}
.btn .spinner{border-width:var(--button-spinner-stroke)}
.btn[data-component="icon-button"] .spinner{border-width:var(--icon-button-spinner-stroke)}
@keyframes spin{to{transform:rotate(360deg)}}

.topbarc{position:relative;display:flex;align-items:center;gap:var(--sp-2);inline-size:100%;min-inline-size:0;block-size:var(--topbar-h);padding-inline:var(--sp-4);background:var(--surface);color:var(--fg);border-block-end:1px solid var(--border)}

.topbarc-account span{display:grid;place-items:center;inline-size:var(--ctl-xs);block-size:var(--ctl-xs);border-radius:var(--radius-full);background:var(--primary-subtle);color:var(--primary);font-size:var(--text-micro)}
