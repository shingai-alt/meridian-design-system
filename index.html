<!doctype html>
<html lang="ja" data-theme="light" data-density="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Reset & base ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:root{
  --font-sans:'Inter','Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Geist Mono','IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --sp-0:0px;--sp-05:2px;--sp-1:4px;--sp-15:6px;--sp-2:8px;--sp-25:10px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;--sp-16:64px;--sp-20:80px;--sp-24:96px;
  --radius-none:0px;--radius-2xs:2px;--radius-xs:4px;--radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-xl:12px;--radius-2xl:16px;--radius-full:999px;
  --dur-instant:50ms;--dur-fast:120ms;--dur-normal:180ms;--dur-slow:240ms;--dur-slower:320ms;
  --ease-standard:cubic-bezier(.2,0,0,1);--ease-enter:cubic-bezier(0,0,.2,1);--ease-exit:cubic-bezier(.4,0,1,1);--ease-emphasized:cubic-bezier(.2,0,0,1.08);
  --sidebar-w:264px;--sidebar-w-collapsed:0px;--topbar-h:52px;--content-max:880px;--toc-w:200px;
  --focus-w:2px;
}
html[data-density="default"]{--ctl-xs:24px;--ctl-sm:28px;--ctl-md:32px;--ctl-lg:38px;--ctl-xl:44px;--text-body:14px;--text-label:13px;--text-small:12px;--text-micro:11px;--lh-normal:1.55;--lh-tight:1.4;--row-h:40px;--cell-y:8px;--card-pad:var(--sp-4);--gap-form:var(--sp-4);--input-x:10px}
html[data-density="compact"]{--ctl-xs:22px;--ctl-sm:26px;--ctl-md:28px;--ctl-lg:34px;--ctl-xl:40px;--text-body:13px;--text-label:12px;--text-small:11px;--text-micro:10px;--lh-normal:1.45;--lh-tight:1.3;--row-h:32px;--cell-y:5px;--card-pad:var(--sp-3);--gap-form:var(--sp-3);--input-x:8px}
html[data-density="comfortable"]{--ctl-xs:26px;--ctl-sm:32px;--ctl-md:36px;--ctl-lg:42px;--ctl-xl:48px;--text-body:15px;--text-label:14px;--text-small:13px;--text-micro:12px;--lh-normal:1.65;--lh-tight:1.5;--row-h:48px;--cell-y:12px;--card-pad:var(--sp-5);--gap-form:var(--sp-5);--input-x:12px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--lh-normal);color:var(--fg);background:var(--bg);font-feature-settings:"cv02","cv03","ss01";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--selection);color:var(--fg)}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
a.btn:hover,a.tb-btn:hover,a.comp-tile:hover{text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
code,pre,kbd{font-family:var(--font-mono)}
:focus{outline:none}
:focus-visible{outline:var(--focus-w) solid var(--focus-ring);outline-offset:2px;border-radius:var(--radius-2xs)}
img,svg{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ App shell ============ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.app.nav-collapsed{grid-template-columns:0 1fr}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sidebar-bg);border-right:1px solid var(--border);padding:var(--sp-3) var(--sp-3) var(--sp-6);scrollbar-width:thin;z-index:40}
.app.nav-collapsed .sidebar{display:none}
.sb-logo{display:flex;align-items:center;gap:var(--sp-25);padding:var(--sp-2) var(--sp-2) var(--sp-3);font-weight:650;font-size:14px;letter-spacing:-.01em;color:var(--fg)}
.sb-logo .mark{width:20px;height:20px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--accent));position:relative;flex:none}
.sb-logo .mark::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sb-logo .ver{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--fg-subtle);background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-full);padding:1px 7px;font-family:var(--font-mono)}
.sb-search{display:flex;align-items:center;gap:var(--sp-2);height:var(--ctl-sm);padding:0 var(--sp-2);margin:0 var(--sp-1) var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--fg-subtle);font-size:var(--text-label);cursor:pointer;transition:border-color var(--dur-fast) var(--ease-standard)}
.sb-search:hover{border-color:var(--border-strong)}
.sb-search kbd{margin-left:auto;font-size:10px;color:var(--fg-subtle);background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-2xs);padding:1px 5px}
.sb-group{margin-top:var(--sp-4)}
.sb-group>.hd{display:flex;align-items:center;width:100%;gap:var(--sp-1);padding:var(--sp-1) var(--sp-2);font-size:var(--text-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle)}
.sb-group>.hd svg{transition:transform var(--dur-fast) var(--ease-standard)}
.sb-group.closed>.hd svg{transform:rotate(-90deg)}
.sb-group.closed>.items{display:none}
.sb-item{display:flex;align-items:center;gap:var(--sp-2);width:100%;padding:0 var(--sp-2);height:calc(var(--ctl-sm) - 2px);border-radius:var(--radius-sm);font-size:var(--text-label);color:var(--fg-muted);text-align:left;transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard)}
.sb-item:hover{background:var(--surface-muted);color:var(--fg);text-decoration:none}
.sb-item[aria-current="page"]{background:var(--sidebar-item-active-bg);color:var(--primary);font-weight:550}
.sb-item .nbadge{margin-left:auto;font-size:9.5px;font-weight:600;padding:0 5px;border-radius:var(--radius-full);background:var(--primary-subtle);color:var(--primary)}
.sb-sub{padding-left:var(--sp-3);margin-left:var(--sp-25);border-left:1px solid var(--border-muted)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:var(--sp-2);height:var(--topbar-h);padding:0 var(--sp-5);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.tb-crumb{display:flex;align-items:center;gap:var(--sp-15);font-size:var(--text-label);color:var(--fg-subtle);min-width:0}
.tb-crumb b{color:var(--fg);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--sp-15)}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-15);height:var(--ctl-sm);min-width:var(--ctl-sm);padding:0 var(--sp-2);border-radius:var(--radius-sm);border:1px solid transparent;color:var(--fg-muted);font-size:var(--text-label);transition:all var(--dur-fast) var(--ease-standard)}
.tb-btn:hover{background:var(--surface-muted);color:var(--fg)}
.tb-btn.bordered{border-color:var(--border);background:var(--surface)}
.tb-seed{width:18px;height:18px;border-radius:var(--radius-full);background:var(--primary);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tb-avatar{width:26px;height:26px;border-radius:var(--radius-full);background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600}
.tb-menu{position:absolute;top:calc(var(--topbar-h) - 6px);right:var(--sp-5);width:280px;background:var(--surface-overlay);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay);padding:var(--sp-3);z-index:60;animation:pop var(--dur-fast) var(--ease-enter)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.tb-menu h4{font-size:var(--text-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);margin:var(--sp-2) 0 var(--sp-15)}
.tb-menu h4:first-child{margin-top:0}

/* content */
.content{flex:1;width:100%}
.doc-wrap{display:grid;grid-template-columns:minmax(0,1fr) var(--toc-w);gap:var(--sp-10);max-width:calc(var(--content-max) + var(--toc-w) + var(--sp-10));margin:0 auto;padding:var(--sp-8) var(--sp-6) var(--sp-20)}
.doc-wrap.no-toc{grid-template-columns:minmax(0,1fr);max-width:var(--content-max)}
.doc-wrap.wide{max-width:1280px;grid-template-columns:minmax(0,1fr)}
.toc{position:sticky;top:calc(var(--topbar-h) + var(--sp-6));align-self:start;font-size:var(--text-small)}
.toc .t{font-size:var(--text-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:var(--sp-2)}
.toc a{display:block;padding:3px 0 3px var(--sp-25);color:var(--fg-muted);border-left:1.5px solid var(--border-muted)}
.toc a:hover{color:var(--fg);text-decoration:none}
.toc a.on{color:var(--primary);border-left-color:var(--primary);font-weight:550}

/* doc typography */
.doc .eyebrow{font-size:var(--text-micro);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:var(--sp-2)}
.doc h1{font-size:28px;font-weight:650;letter-spacing:-.022em;line-height:1.2;margin-bottom:var(--sp-3)}
.doc .lead{font-size:15px;color:var(--fg-muted);max-width:640px;margin-bottom:var(--sp-6)}
.doc h2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:var(--sp-10) 0 var(--sp-3);padding-top:var(--sp-4);border-top:1px solid var(--border-muted);scroll-margin-top:calc(var(--topbar-h) + var(--sp-4))}
.doc h2:first-of-type{border-top:none;padding-top:0}
.doc h3{font-size:15px;font-weight:600;margin:var(--sp-6) 0 var(--sp-2)}
.doc h4{font-size:var(--text-body);font-weight:600;margin:var(--sp-4) 0 var(--sp-15)}
.doc p{margin-bottom:var(--sp-3);max-width:640px;color:var(--fg)}
.doc p.muted{color:var(--fg-muted)}
.doc ul.plain{margin:0 0 var(--sp-3) var(--sp-5);max-width:640px}
.doc ul.plain li{margin-bottom:var(--sp-1);color:var(--fg)}
.doc hr{border:none;border-top:1px solid var(--border-muted);margin:var(--sp-8) 0}
.doc .callout{display:flex;gap:var(--sp-25);padding:var(--sp-3) var(--sp-4);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-muted);font-size:var(--text-label);color:var(--fg-muted);max-width:640px;margin-bottom:var(--sp-4)}
.doc .callout.info{border-color:color-mix(in srgb,var(--info) 30%,var(--border));background:var(--info-subtle);color:var(--fg)}
.doc .callout.warn{border-color:color-mix(in srgb,var(--warning) 40%,var(--border));background:var(--warning-subtle);color:var(--fg)}
.doc code.inline{font-size:.86em;background:var(--surface-muted);border:1px solid var(--border-muted);border-radius:var(--radius-2xs);padding:1px 5px;color:var(--fg)}

/* generic surfaces */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.panel.pad{padding:var(--card-pad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-4)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3)}
@media(max-width:900px){.grid3,.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.rowflex{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}

/* code block */
.codeblock{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin:var(--sp-3) 0;font-size:12.5px}
.codeblock .cb-hd{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-15) var(--sp-3);border-bottom:1px solid var(--border);color:var(--fg-subtle);font-size:var(--text-micro);font-family:var(--font-mono)}
.codeblock .cb-hd .cp{margin-left:auto}
.codeblock pre{padding:var(--sp-3) var(--sp-4);overflow-x:auto;line-height:1.6;color:var(--fg);tab-size:2}
.codeblock .tk-k{color:var(--code-k)}.codeblock .tk-s{color:var(--code-s)}.codeblock .tk-c{color:var(--fg-subtle);font-style:italic}.codeblock .tk-f{color:var(--code-f)}.codeblock .tk-n{color:var(--code-n)}.codeblock .tk-p{color:var(--fg-muted)}
.cp{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-micro);color:var(--fg-subtle);border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-2xs);padding:2px 7px;transition:all var(--dur-fast) var(--ease-standard)}
.cp:hover{color:var(--fg);border-color:var(--border-strong)}
.cp.ok{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,var(--border))}

/* token tables */
.ttable{width:100%;border-collapse:collapse;font-size:var(--text-label)}
.ttable th{text-align:left;font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-subtle);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border)}
.ttable td{padding:var(--cell-y) var(--sp-3);border-bottom:1px solid var(--border-muted);vertical-align:middle}
.ttable tr:hover td{background:var(--table-row-hover)}
.ttable .mono{font-family:var(--font-mono);font-size:.92em}
.ttable .swpair{display:flex;align-items:center;gap:var(--sp-2)}
.sw{width:18px;height:18px;border-radius:var(--radius-xs);border:1px solid var(--border);flex:none}
.tscroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.tscroll .ttable td:first-child,.tscroll .ttable th:first-child{padding-left:var(--sp-4)}

/* palette strips */
.pal{display:grid;grid-template-columns:110px repeat(11,1fr);align-items:center;gap:4px;margin-bottom:6px}
.pal .nm{font-size:var(--text-small);font-family:var(--font-mono);color:var(--fg-muted)}
.pal .cell{height:34px;border-radius:var(--radius-xs);position:relative;cursor:pointer;border:1px solid rgba(0,0,0,.06)}
.pal .cell span{position:absolute;left:5px;bottom:3px;font-size:9px;font-family:var(--font-mono);opacity:.85}
@media(max-width:800px){.pal{grid-template-columns:80px repeat(11,1fr)}.pal .cell span{display:none}}

/* ============ Component library ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-15);font-weight:550;border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard);position:relative;user-select:none}
.btn[data-size="xs"]{height:var(--ctl-xs);padding:0 var(--sp-2);font-size:var(--text-micro)}
.btn[data-size="sm"]{height:var(--ctl-sm);padding:0 var(--sp-25);font-size:var(--text-small)}
.btn[data-size="md"]{height:var(--ctl-md);padding:0 var(--sp-3);font-size:var(--text-label)}
.btn[data-size="lg"]{height:var(--ctl-lg);padding:0 var(--sp-4);font-size:var(--text-body)}
.btn[data-size="xl"]{height:var(--ctl-xl);padding:0 var(--sp-5);font-size:var(--text-body)}
.btn[data-icononly]{padding:0;aspect-ratio:1;width:auto}
.btn[data-variant="primary"]{background:var(--button-primary-bg);color:var(--button-primary-fg);box-shadow:var(--shadow-xs),inset 0 1px 0 rgba(255,255,255,.08)}
.btn[data-variant="primary"]:hover{background:var(--button-primary-bg-hover)}
.btn[data-variant="primary"]:active{background:var(--button-primary-bg-active)}
.btn[data-variant="secondary"]{background:var(--surface);border-color:var(--border);color:var(--fg);box-shadow:var(--shadow-xs)}
.btn[data-variant="secondary"]:hover{border-color:var(--border-strong);background:var(--surface-muted)}
.btn[data-variant="secondary"]:active{background:var(--bg-subtle)}
.btn[data-variant="tertiary"]{background:var(--primary-subtle);color:var(--primary)}
.btn[data-variant="tertiary"]:hover{background:var(--primary-muted)}
.btn[data-variant="ghost"]{color:var(--fg-muted)}
.btn[data-variant="ghost"]:hover{background:var(--surface-muted);color:var(--fg)}
.btn[data-variant="outline"]{border-color:var(--border-strong);color:var(--fg)}
.btn[data-variant="outline"]:hover{background:var(--surface-muted)}
.btn[data-variant="danger"]{background:var(--danger);color:#fff;box-shadow:var(--shadow-xs)}
.btn[data-variant="danger"]:hover{background:color-mix(in srgb,var(--danger) 88%,#000)}
.btn[data-variant="success"]{background:var(--success);color:#fff;box-shadow:var(--shadow-xs)}
.btn[data-variant="success"]:hover{background:color-mix(in srgb,var(--success) 88%,#000)}
.btn[data-variant="link"]{color:var(--primary);padding-left:2px;padding-right:2px;height:auto}
.btn[data-variant="link"]:hover{text-decoration:underline}
.btn:disabled,.btn[data-disabled]{opacity:.5;pointer-events:none}
.btn[data-loading]{color:transparent!important;pointer-events:none}
.btn[data-loading] .btnspin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.btn[data-variant="primary"][data-loading] .btnspin,.btn[data-variant="danger"][data-loading] .btnspin{color:#fff}
.btn[data-full]{width:100%}
.spinner{width:1em;height:1em;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-micro);font-weight:550;padding:1px 8px;border-radius:var(--radius-full);border:1px solid transparent;line-height:1.7}
.badge[data-tone="neutral"]{background:var(--surface-muted);color:var(--fg-muted);border-color:var(--border)}
.badge[data-tone="primary"]{background:var(--primary-subtle);color:var(--primary)}
.badge[data-tone="success"]{background:var(--success-subtle);color:var(--success-fg)}
.badge[data-tone="warning"]{background:var(--warning-subtle);color:var(--warning-fg)}
.badge[data-tone="danger"]{background:var(--danger-subtle);color:var(--danger-fg)}
.badge[data-tone="info"]{background:var(--info-subtle);color:var(--info-fg)}
.badge[data-outline]{background:transparent;border-color:currentColor;opacity:.9}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tagc{display:inline-flex;align-items:center;gap:5px;font-size:var(--text-small);padding:2px 4px 2px 9px;border-radius:var(--radius-xs);background:var(--surface-muted);border:1px solid var(--border);color:var(--fg-muted)}
.tagc .x{display:inline-flex;border-radius:var(--radius-2xs);padding:1px;color:var(--fg-subtle)}
.tagc .x:hover{background:var(--border);color:var(--fg)}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-full);background:var(--primary-muted);color:var(--primary);font-weight:600;flex:none;border:1px solid color-mix(in srgb,var(--primary) 20%,transparent)}
.avatar[data-size="xs"]{width:20px;height:20px;font-size:8.5px}
.avatar[data-size="sm"]{width:24px;height:24px;font-size:10px}
.avatar[data-size="md"]{width:32px;height:32px;font-size:12px}
.avatar[data-size="lg"]{width:40px;height:40px;font-size:14px}
.avstack{display:inline-flex}
.avstack .avatar{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.avstack .avatar:first-child{margin-left:0}
.divider{border:none;border-top:1px solid var(--border);margin:var(--sp-4) 0}
.skeleton{background:linear-gradient(90deg,var(--surface-muted) 25%,var(--border-muted) 50%,var(--surface-muted) 75%);background-size:200% 100%;animation:sk 1.4s ease infinite;border-radius:var(--radius-xs)}
@keyframes sk{to{background-position:-200% 0}}
.statusdot{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-small);color:var(--fg-muted)}
.statusdot i{width:8px;height:8px;border-radius:50%;flex:none}
.statusdot[data-s="online"] i,.statusdot[data-s="success"] i{background:var(--success)}
.statusdot[data-s="warning"] i,.statusdot[data-s="degraded"] i{background:var(--warning)}
.statusdot[data-s="danger"] i,.statusdot[data-s="error"] i{background:var(--danger)}
.statusdot[data-s="neutral"] i,.statusdot[data-s="idle"] i{background:var(--fg-subtle)}
.statusdot[data-s="running"] i{background:var(--info);animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{opacity:.35}}

/* inputs */
.input{display:flex;align-items:center;gap:var(--sp-2);height:var(--ctl-md);padding:0 var(--input-x);background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-sm);transition:border-color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard);color:var(--fg)}
.input input,.input select{flex:1;min-width:0;background:none;border:none;outline:none;font-size:var(--text-label);color:var(--fg);height:100%}
.input input::placeholder{color:var(--input-placeholder)}
.input:hover{border-color:var(--border-strong)}
.input:focus-within{border-color:var(--input-border-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.input[data-invalid]{border-color:var(--danger)}
.input[data-invalid]:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}
.input[data-disabled]{background:var(--surface-muted);color:var(--fg-disabled);pointer-events:none}
.input[data-size="sm"]{height:var(--ctl-sm)}
.input[data-size="lg"]{height:var(--ctl-lg)}
.input .affix{color:var(--fg-subtle);display:flex;align-items:center;font-size:var(--text-small)}
textarea.input{height:auto;min-height:72px;padding:var(--sp-2) var(--input-x);resize:vertical;width:100%;font-size:var(--text-label);line-height:var(--lh-normal)}
.field{display:flex;flex-direction:column;gap:var(--sp-15);margin-bottom:var(--gap-form)}
.field>label{font-size:var(--text-label);font-weight:550;color:var(--fg)}
.field>label .req{color:var(--danger)}
.field .help{font-size:var(--text-small);color:var(--fg-subtle)}
.field .err{display:flex;align-items:center;gap:5px;font-size:var(--text-small);color:var(--danger-fg)}
.checkbox,.radioc{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--text-label);cursor:pointer;user-select:none}
.checkbox input,.radioc input{appearance:none;width:16px;height:16px;border:1.5px solid var(--border-strong);background:var(--input-bg);cursor:pointer;flex:none;transition:all var(--dur-fast) var(--ease-standard);display:grid;place-content:center}
.checkbox input{border-radius:var(--radius-xs)}
.radioc input{border-radius:50%}
.checkbox input:checked,.radioc input:checked{background:var(--primary);border-color:var(--primary)}
.checkbox input:checked::after{content:"";width:9px;height:9px;background:var(--primary-fg);clip-path:polygon(14% 46%,0 62%,40% 100%,100% 18%,84% 4%,38% 68%)}
.radioc input:checked::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary-fg)}
.checkbox input:disabled,.radioc input:disabled{opacity:.5;cursor:not-allowed}
.switch{position:relative;display:inline-flex;align-items:center;gap:var(--sp-2);cursor:pointer;font-size:var(--text-label)}
.switch input{appearance:none;width:32px;height:18px;border-radius:var(--radius-full);background:var(--border-strong);cursor:pointer;transition:background var(--dur-fast) var(--ease-standard);flex:none;position:relative}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--dur-fast) var(--ease-standard)}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{transform:translateX(14px)}
.switch input:disabled{opacity:.5;cursor:not-allowed}
input[type="range"].sliderc{appearance:none;width:100%;height:4px;border-radius:var(--radius-full);background:linear-gradient(to right,var(--primary) var(--val,50%),var(--border) var(--val,50%));cursor:pointer}
input[type="range"].sliderc::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--surface);border:1.5px solid var(--primary);box-shadow:var(--shadow-xs)}

/* tabs / seg */
.tabs{display:flex;gap:var(--sp-1);border-bottom:1px solid var(--border)}
.tabs .tab{padding:var(--sp-2) var(--sp-25);font-size:var(--text-label);font-weight:500;color:var(--fg-muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--dur-fast) var(--ease-standard)}
.tabs .tab:hover{color:var(--fg)}
.tabs .tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:550}
.seg{display:inline-flex;background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px;gap:2px}
.seg button{padding:0 var(--sp-25);height:calc(var(--ctl-sm) - 6px);border-radius:var(--radius-xs);font-size:var(--text-small);font-weight:500;color:var(--fg-muted);transition:all var(--dur-fast) var(--ease-standard)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-xs);font-weight:550}
.crumbs{display:flex;align-items:center;gap:var(--sp-15);font-size:var(--text-label);color:var(--fg-subtle)}
.crumbs a{color:var(--fg-subtle)}
.crumbs a:hover{color:var(--fg);text-decoration:none}
.crumbs .cur{color:var(--fg);font-weight:550}

/* alert/banner/toast */
.alertc{display:flex;gap:var(--sp-25);padding:var(--sp-3) var(--sp-4);border-radius:var(--radius-md);border:1px solid;font-size:var(--text-label);align-items:flex-start}
.alertc .ic{flex:none;margin-top:1px}
.alertc b{display:block;font-weight:600;margin-bottom:2px}
.alertc[data-tone="info"]{background:var(--info-subtle);border-color:color-mix(in srgb,var(--info) 35%,transparent);color:var(--fg)}
.alertc[data-tone="info"] .ic{color:var(--info)}
.alertc[data-tone="success"]{background:var(--success-subtle);border-color:color-mix(in srgb,var(--success) 35%,transparent)}
.alertc[data-tone="success"] .ic{color:var(--success)}
.alertc[data-tone="warning"]{background:var(--warning-subtle);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.alertc[data-tone="warning"] .ic{color:var(--warning-fg)}
.alertc[data-tone="danger"]{background:var(--danger-subtle);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.alertc[data-tone="danger"] .ic{color:var(--danger)}
.toastc{display:flex;align-items:flex-start;gap:var(--sp-25);width:340px;padding:var(--sp-3) var(--sp-3);background:var(--surface-overlay);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);font-size:var(--text-label)}
.toastc b{font-weight:600;display:block}
.toastc .sub{color:var(--fg-muted);font-size:var(--text-small)}
#toast-root{position:fixed;bottom:var(--sp-5);right:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-2);z-index:100}
#toast-root .toastc{animation:toastin var(--dur-normal) var(--ease-enter)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.progressc{height:6px;border-radius:var(--radius-full);background:var(--surface-muted);border:1px solid var(--border-muted);overflow:hidden}
.progressc>i{display:block;height:100%;background:var(--primary);border-radius:inherit;transition:width var(--dur-slow) var(--ease-standard)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:var(--text-label)}
.tbl th{text-align:left;font-size:var(--text-micro);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-subtle);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);background:var(--surface-muted);white-space:nowrap}
.tbl td{padding:var(--cell-y) var(--sp-3);border-bottom:1px solid var(--border-muted);height:var(--row-h)}
.tbl tbody tr{transition:background var(--dur-instant) linear}
.tbl tbody tr:hover{background:var(--table-row-hover)}
.tbl tbody tr[data-selected]{background:var(--primary-subtle)}
.tbl .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.tbl th.num{text-align:right}

/* cards */
.cardc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--card-pad);transition:border-color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
.cardc.hover:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.kpi .lbl{font-size:var(--text-small);color:var(--fg-muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:var(--sp-1) 0}
.kpi .delta{font-size:var(--text-small);display:inline-flex;align-items:center;gap:3px;font-weight:550}
.kpi .delta.up{color:var(--success-fg)}.kpi .delta.down{color:var(--danger-fg)}
.kv{display:flex;justify-content:space-between;gap:var(--sp-4);padding:var(--cell-y) 0;border-bottom:1px solid var(--border-muted);font-size:var(--text-label)}
.kv dt{color:var(--fg-muted)}.kv dd{font-weight:500;text-align:right}
.emptyc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--sp-10) var(--sp-6);border:1px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--bg-subtle)}
.emptyc .ic{width:40px;height:40px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);display:grid;place-content:center;color:var(--fg-subtle);margin-bottom:var(--sp-3);box-shadow:var(--shadow-xs)}
.emptyc h4{font-size:var(--text-body);font-weight:600;margin-bottom:var(--sp-1)}
.emptyc p{font-size:var(--text-label);color:var(--fg-muted);max-width:340px;margin-bottom:var(--sp-4)}

/* AI components */
.chatmsg{display:flex;gap:var(--sp-25);margin-bottom:var(--sp-4);max-width:720px}
.chatmsg .body{min-width:0;flex:1}
.chatmsg .who{font-size:var(--text-micro);font-weight:600;color:var(--fg-subtle);margin-bottom:3px;display:flex;gap:6px;align-items:center}
.chatmsg .bubble{font-size:var(--text-label);line-height:var(--lh-normal)}
.chatmsg[data-role="user"] .bubble{background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-25) var(--sp-3);display:inline-block}
.chatmsg .actions{display:flex;gap:2px;margin-top:var(--sp-1);opacity:0;transition:opacity var(--dur-fast) linear}
.chatmsg:hover .actions{opacity:1}
.toolcall{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-muted);margin:var(--sp-2) 0;font-size:var(--text-small);overflow:hidden}
.toolcall .hd{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-15) var(--sp-25);color:var(--fg-muted);font-family:var(--font-mono)}
.toolcall pre{padding:var(--sp-2) var(--sp-3);border-top:1px solid var(--border-muted);color:var(--fg-muted);overflow-x:auto;font-size:11px}
.promptbox{border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--surface);box-shadow:var(--shadow-sm);transition:border-color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
.promptbox:focus-within{border-color:var(--input-border-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}
.promptbox textarea{width:100%;border:none;background:none;resize:none;padding:var(--sp-3) var(--sp-4) var(--sp-1);font-size:var(--text-label);line-height:var(--lh-normal);outline:none;min-height:52px;color:var(--fg)}
.promptbox .bar{display:flex;align-items:center;gap:var(--sp-1);padding:var(--sp-15) var(--sp-2) var(--sp-2)}
.promptbox .hint{margin-left:auto;font-size:var(--text-micro);color:var(--fg-subtle);display:flex;align-items:center;gap:var(--sp-2)}
.runlog{font-family:var(--font-mono);font-size:11.5px;background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.runlog .row{display:flex;gap:var(--sp-25);padding:4px var(--sp-3);border-bottom:1px solid var(--border-muted);align-items:baseline}
.runlog .row:hover{background:var(--table-row-hover)}
.runlog .ts{color:var(--fg-subtle);flex:none}
.runlog .lv{flex:none;width:44px;font-weight:600}
.runlog .lv.info{color:var(--info)}.runlog .lv.warn{color:var(--warning-fg)}.runlog .lv.error{color:var(--danger-fg)}.runlog .lv.ok{color:var(--success-fg)}
.diffv{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--code-bg)}
.diffv .fh{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-15) var(--sp-3);background:var(--surface-muted);border-bottom:1px solid var(--border);font-size:11px;color:var(--fg-muted)}
.diffv .ln{display:flex}
.diffv .no{width:36px;flex:none;text-align:right;padding-right:8px;color:var(--fg-subtle);user-select:none;font-size:10px;line-height:1.9}
.diffv .cd{flex:1;padding:0 var(--sp-2);white-space:pre;line-height:1.9}
.diffv .ln.add{background:color-mix(in srgb,var(--success) 12%,transparent)}
.diffv .ln.add .cd::before{content:"+ ";color:var(--success-fg)}
.diffv .ln.del{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.diffv .ln.del .cd::before{content:"- ";color:var(--danger-fg)}
.filetree{font-size:var(--text-label)}
.filetree .fnode{display:flex;align-items:center;gap:6px;padding:3px var(--sp-2);border-radius:var(--radius-xs);color:var(--fg-muted);cursor:pointer}
.filetree .fnode:hover{background:var(--surface-muted);color:var(--fg)}
.filetree .fnode.active{background:var(--primary-subtle);color:var(--primary);font-weight:500}
.filetree .fnode .mod{width:6px;height:6px;border-radius:50%;background:var(--warning);margin-left:auto}
.meterc .bar{height:8px;border-radius:var(--radius-full);background:var(--surface-muted);border:1px solid var(--border-muted);overflow:hidden;display:flex}
.meterc .bar i{height:100%}
.meterc .lbl{display:flex;justify-content:space-between;font-size:var(--text-small);color:var(--fg-muted);margin-bottom:var(--sp-1)}
.wfstep{display:flex;gap:var(--sp-25);align-items:flex-start}
.wfstep .nd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-content:center;font-size:10px;font-weight:600;color:var(--fg-subtle);flex:none;background:var(--surface)}
.wfstep.done .nd{background:var(--success);border-color:var(--success);color:#fff}
.wfstep.active .nd{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 3px var(--primary-subtle)}
.wfstep .ln2{width:1.5px;flex:1;background:var(--border);min-height:20px;margin-left:10px}

/* dialog / drawer / popover / cmdk */
.ovl{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:flex-start;justify-content:center;animation:fade var(--dur-fast) linear}
@keyframes fade{from{opacity:0}}
.dialogc{background:var(--surface-overlay);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-overlay);width:min(480px,calc(100vw - 32px));margin-top:12vh;animation:pop var(--dur-normal) var(--ease-enter)}
.dialogc .dhd{padding:var(--sp-4) var(--sp-5) 0}
.dialogc .dhd h3{font-size:16px;font-weight:600}
.dialogc .dhd p{font-size:var(--text-label);color:var(--fg-muted);margin-top:var(--sp-1)}
.dialogc .dbd{padding:var(--sp-4) var(--sp-5)}
.dialogc .dft{display:flex;justify-content:flex-end;gap:var(--sp-2);padding:var(--sp-3) var(--sp-5) var(--sp-4);border-top:1px solid var(--border-muted)}
.cmdk{background:var(--surface-overlay);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-overlay);width:min(560px,calc(100vw - 32px));margin-top:14vh;overflow:hidden;animation:pop var(--dur-normal) var(--ease-enter)}
.cmdk .ci{display:flex;align-items:center;gap:var(--sp-25);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border)}
.cmdk .ci input{flex:1;border:none;background:none;outline:none;font-size:14px;color:var(--fg)}
.cmdk .list{max-height:320px;overflow-y:auto;padding:var(--sp-2)}
.cmdk .ghd{font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-subtle);padding:var(--sp-2) var(--sp-25) var(--sp-1)}
.cmdk .it{display:flex;align-items:center;gap:var(--sp-25);width:100%;padding:var(--sp-2) var(--sp-25);border-radius:var(--radius-sm);font-size:var(--text-label);color:var(--fg);text-align:left}
.cmdk .it .k{margin-left:auto;font-size:10px;color:var(--fg-subtle);font-family:var(--font-mono)}
.cmdk .it.sel,.cmdk .it:hover{background:var(--surface-muted)}
.cmdk .empty{padding:var(--sp-8);text-align:center;color:var(--fg-subtle);font-size:var(--text-label)}

/* ============ playground ============ */
.pg{border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden;background:var(--surface)}
.pg-top{display:grid;grid-template-columns:1fr 264px}
@media(max-width:860px){.pg-top{grid-template-columns:1fr}}
.pg-preview{display:flex;align-items:center;justify-content:center;min-height:240px;padding:var(--sp-8);position:relative}
.pg-preview[data-bg="bg"]{background:var(--bg)}
.pg-preview[data-bg="surface"]{background:var(--surface)}
.pg-preview[data-bg="muted"]{background:var(--bg-subtle);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:16px 16px}
.pg-controls{border-left:1px solid var(--border);background:var(--bg-subtle);padding:var(--sp-4);overflow-y:auto;max-height:460px}
@media(max-width:860px){.pg-controls{border-left:none;border-top:1px solid var(--border)}}
.pg-controls .ctl{margin-bottom:var(--sp-3)}
.pg-controls .ctl>span{display:block;font-size:var(--text-micro);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:var(--sp-1)}
.pg-controls .opts{display:flex;flex-wrap:wrap;gap:4px}
.pg-controls .opt{font-size:var(--text-small);padding:2px 9px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);transition:all var(--dur-fast) var(--ease-standard)}
.pg-controls .opt:hover{border-color:var(--border-strong);color:var(--fg)}
.pg-controls .opt[aria-pressed="true"]{background:var(--primary-subtle);border-color:color-mix(in srgb,var(--primary) 45%,transparent);color:var(--primary);font-weight:550}
.pg-code{border-top:1px solid var(--border)}
.pg-code .codeblock{margin:0;border:none;border-radius:0}
.pg-compare{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
.pg-compare>div{padding:var(--sp-5);display:flex;align-items:center;justify-content:center;gap:var(--sp-2);flex-direction:column}
.pg-compare .cl{font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.6}
@media(max-width:700px){.pg-compare{grid-template-columns:1fr}}
.pg-tokens{border-top:1px solid var(--border);padding:var(--sp-3) var(--sp-4);background:var(--bg-subtle)}
.pg-tokens .t{font-size:var(--text-micro);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:var(--sp-2)}
.pg-tokens .rowflex{gap:6px}
.tokchip{font-family:var(--font-mono);font-size:10.5px;padding:2px 8px;border-radius:var(--radius-full);background:var(--surface);border:1px solid var(--border);color:var(--fg-muted);cursor:pointer}
.tokchip:hover{border-color:var(--border-strong);color:var(--fg)}

/* do/dont */
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);margin:var(--sp-3) 0}
@media(max-width:700px){.dodont{grid-template-columns:1fr}}
.dodont .box{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.dodont .box .cap{display:flex;gap:6px;align-items:center;padding:var(--sp-2) var(--sp-3);font-size:var(--text-small);font-weight:600;border-bottom:1px solid var(--border-muted)}
.dodont .do .cap{color:var(--success-fg);background:var(--success-subtle)}
.dodont .dont .cap{color:var(--danger-fg);background:var(--danger-subtle)}
.dodont .bd{padding:var(--sp-4);display:flex;align-items:center;justify-content:center;min-height:88px;background:var(--surface)}
.dodont .tx{padding:var(--sp-2) var(--sp-3);font-size:var(--text-small);color:var(--fg-muted);border-top:1px solid var(--border-muted)}

/* home hero */
.hero{border-bottom:1px solid var(--border);background:
  radial-gradient(600px 300px at 78% 10%,color-mix(in srgb,var(--primary) 7%,transparent),transparent 70%),
  linear-gradient(var(--bg-subtle),var(--bg));position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--border-muted) 1px,transparent 1px),linear-gradient(90deg,var(--border-muted) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(700px 420px at 70% 30%,black,transparent);opacity:.5;pointer-events:none}

 * 特に黒/白へ向けたブレンドで彩度が濁って見えやすかった(sRGBの補間は
 * 知覚的にもガンマ的にも均一ではない)。OKLab(直交座標なので色相の
 * 巻き戻り問題もない)でL/a/bを補間し、そこからoklchToHexで書き戻すことで、
 * 「primary-subtleは薄いprimaryの色味を保ったまま暗くなる」ような
 * 直感通りのブレンド結果になる。 */

 * 選んだシード色によってはAA基準(4.5:1)を満たさない組み合わせが出ていた。 */

function buildPalettes(seed){

   * OKLCHはoklchToHexが色相に応じて自動的に収めるので単純な相対値で済む。 */

  const accent=makeScale((s.h+42)%360, clamp(s.c*.95,0.10,0.28));
  const neutral=makeNeutral(s.h, clamp(s.c*.045,0.006,0.018));

/* copy + toast */
function copyText(t,btn){navigator.clipboard.writeText(t).then(()=>{if(btn){const o=btn.innerHTML;btn.classList.add('ok');btn.innerHTML=I.check+' Copied';setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=o},1200)}else toast('コピーしました',t)})}
function toast(title,sub,tone){const r=$('#toast-root');const el=document.createElement('div');el.className='toastc';
  el.innerHTML=`<span class="ic" style="color:var(--${tone==='danger'?'danger':tone==='success'?'success':'info'})">${tone==='danger'?I.err:tone==='success'?I.ok:I.info}</span><div style="flex:1;min-width:0"><b>${esc(title)}</b>${sub?`<span class="sub">${esc(sub)}</span>`:''}</div><button class="tb-btn" aria-label="閉じる" onclick="this.closest('.toastc').remove()">${I.x}</button>`;
  r.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},4000)}
document.addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');if(cp){copyText(cp.dataset.copy,cp.classList.contains('cp')?cp:null);return}
});

/* simple syntax highlight */
function hl(code,lang){let s=esc(code);
  if(lang==='css'||lang==='json'){
    s=s.replace(/(&quot;[^&]*?&quot;)/g,'<span class="tk-s">$1</span>');
    s=s.replace(/(--[\w-]+)/g,'<span class="tk-f">$1</span>');
    s=s.replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="tk-c">$1</span>');
    s=s.replace(/\b(\d+(?:\.\d+)?(?:px|ms|rem|em|%)?)\b/g,'<span class="tk-n">$1</span>');
  } else {
    s=s.replace(/(\/\/[^\n]*)/g,'<span class="tk-c">$1</span>');
    s=s.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;|'[^']*'|`[^`]*`)/g,'<span class="tk-s">$1</span>');
    s=s.replace(/\b(import|from|export|const|let|return|function|default|new|if|else|async|await|true|false|null)\b/g,'<span class="tk-k">$1</span>');
    s=s.replace(/(&lt;\/?)([A-Z][\w.]*)/g,'$1<span class="tk-f">$2</span>');
    s=s.replace(/\s([a-zA-Z-]+)=(?=&quot;|\{)/g,' <span class="tk-n">$1</span>=');
  }
  return s}
function codeBlock(code,lang='tsx',label){
  return `<div class="codeblock"><div class="cb-hd">${esc(label||lang)}<button class="cp cb-copy-btn" data-copy="${esc(code)}">${I.copy} Copy</button></div><pre><code>${hl(code,lang)}</code></pre></div>`}

const COMPONENTS=[];

function def(c){
  c.states=c.states||['default'];
  c.tokens=c.tokens||['--surface','--border','--foreground'];
  c.a11y=c.a11y||['ロールと accessible name を必ず与える','フォーカス可視化は focus-ring トークンで統一する'];
  c.keys=c.keys||[['Tab','フォーカス移動']];

  COMPONENTS.push(c);CMAP[c.id]=c;
}

/* ============ Docs helpers ============ */
const PAGES={};
function docPage(id,fn){PAGES[id]=fn}
function shell(html,opts={}){return `<div class="doc-wrap ${opts.wide?'wide':''} ${opts.toc===false?'no-toc':''}"><article class="doc" id="doc-body">${html}</article>${opts.toc!==false&&!opts.wide?'<nav class="toc" id="toc" aria-label="このページ"></nav>':''}</div>`}
function head(eyebrow,title,lead){return `<p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(title)}</h1><p class="lead">${lead}</p>`}
let H2N=0;
function h2(t){return `<h2 id="s-${++H2N}">${t}</h2>`}
function nextPrev(prev,next){let s='<div class="next-prev">';
  if(prev)s+=`<a href="#/${prev[0]}"><small>← 前へ</small>${esc(prev[1])}</a>`;
  if(next)s+=`<a class="n" href="#/${next[0]}"><small>次へ →</small>${esc(next[1])}</a>`;
  return s+'</div>'}
function preview(html,label){return `<div class="panel" style="margin:var(--sp-3) 0;overflow:hidden">${label?`<div style="padding:6px 14px;border-bottom:1px solid var(--border-muted);font-size:var(--text-micro);color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.05em;font-weight:600">${esc(label)}</div>`:''}<div style="padding:var(--sp-6);display:flex;align-items:center;justify-content:center;gap:var(--sp-3);flex-wrap:wrap;background:var(--bg-subtle)">${html}</div></div>`}

/* ============ Overview ============ */
docPage('overview/introduction',()=>shell(`
${head('Overview','Meridian Design System','<b>Meridian</b> は、SaaS・AI プロダクト・Developer Tool のための、トークン駆動のデザインシステムです。1 つの Seed color から、Light / Dark / High contrast のテーマと 3 段階の密度を一貫して導出します。')}
<div class="rowflex" style="margin-bottom:var(--sp-6)">${badge({label:'v2.4.1',tone:'primary'})}${badge({label:'60+ components',tone:'neutral'})}${badge({label:'WCAG 2.2 AA',tone:'success'})}</div>
${h2('Meridian とは')}
<p>Meridian(子午線)は、座標の基準となる線です。このシステムでは、Seed color とデザイントークンが UI 全体の「基準線」となり、色・余白・タイポグラフィ・モーションのすべてがそこから導出されます。</p>
<p class="muted"><b>Tagline:</b> Calm precision for product interfaces — 静かな精密さを、プロダクトの隅々まで。</p>
<p><b>Concept statement:</b> 装飾ではなく判断を助ける UI を、トークンという再現可能な仕組みで作る。デザイナーとエンジニアが同じ語彙(トークン名)で会話でき、テーマ・密度・ブランド色の変更に設計変更なしで耐えることを目的とします。</p>
${h2('システムの態度')}
<p>UI デザインには大きく 3 つの態度があります。装飾を削ぎ落とし余白と精度で階層を作る<b>ミニマル</b>、色のトーンとモーションでブランドを語る<b>表現力</b>、1 画面の情報量を最大化する<b>高密度エンタープライズ</b>です。Meridian はこの 3 つから<b>ミニマル</b>を選択しています。</p>
<ul class="plain">
<li>想定用途が SaaS・AI プロダクト・Developer Tool であり、ブランド表現より判断の速さを優先すべきだから。</li>
<li>色・角丸・影・モーションのトークン数を絞るほど、テーマ / Seed / 密度が変わっても破綻しにくく、保守コストが低いから。</li>
<li>高密度な画面が必要になった場合も、態度そのものを変えるのではなく <a href="#/foundations/spacing">Density: Compact</a> で対応します。「高密度エンタープライズ型のコンポーネント群」を別途作ることはしません。</li>
</ul>
<div class="callout">${I.info}<span>新しいコンポーネントやトークンを追加する前に「これはユーザーの判断を速くするか、それとも装飾か」を問い、後者であれば追加しません。色・影・角丸の具体的な運用ルールは <a href="#/foundations/color">Color</a> / <a href="#/foundations/elevation">Elevation & Border</a> を参照してください。</span></div>
${h2('設計思想の要約')}
<ul class="plain">
<li><b>Clarity over decoration</b> — 情報の優先順位・状態・アクションが一目で分かることを最優先する。</li>
<li><b>Tokens before components</b> — すべてのコンポーネントは Primitive → Semantic → Component の 3 層トークンから構成される。</li>
<li><b>Adaptive by default</b> — テーマ・密度・Seed の変更は「対応する」ものではなく「前提」である。</li>
<li><b>Accessible precision</b> — フォーカス・コントラスト・キーボード操作は初期設計に含める。</li>
</ul>
<p>7 つの原則の全文は <a href="#/overview/principles">Principles</a> を参照してください。</p>
${h2('このサイト自体がデモです')}
<div class="callout info">${I.info}<span>右上の <b>テーマ切替・Density 切替・Seed picker</b> を操作すると、ドキュメント・コンポーネント・テンプレートを含むサイト全体が即座に再テーマ化されます。これが Meridian のトークンアーキテクチャの実働デモです。</span></div>
${h2('構成')}
<div class="grid3">
${[['Foundations','色・タイポグラフィ・余白・モーションの基礎設計','foundations/color'],['Tokens','全トークンの一覧と CSS / JSON 出力','tokens/overview'],['Components','60+ のコンポーネント詳細と Playground','components/button'],['Patterns','画面設計の定石パターン','patterns/dashboard-layout'],['Templates','実プロダクト相当の画面テンプレート','templates/saas-dashboard'],['Resources','実装ガイド・チェックリスト','resources/react-usage']].map(([t,d,l])=>`<a class="comp-tile" href="#/${l}" style="padding:var(--sp-4)"><b style="font-size:var(--text-body)">${t}</b><p style="font-size:var(--text-small);color:var(--fg-muted);margin-top:4px">${d}</p></a>`).join('')}
</div>
${nextPrev(null,['overview/principles','Principles'])}`));

docPage('overview/principles',()=>shell(`
${head('Overview','Principles','Meridian のすべての設計判断は、以下の 7 原則に基づきます。迷ったときは原則に戻ります。')}
${[
['1','Clarity over decoration','UI は装飾ではなく、意思決定を助けるためのものです。情報の優先順位・状態・実行できるアクションが一目で分かることを、視覚的な新しさよりも優先します。要素を足す前に「これはユーザーの判断を速くするか」を問います。'],
['2','Density with rhythm','SaaS や Developer Tool では高密度な情報表示が必要です。ただし詰め込むのではなく、余白・線・階層・コントラストで「読みやすい密度」を作ります。行の高さ・余白は Density トークンでリズムとして管理します。'],
['3','Tokens before components','すべてのコンポーネントはトークンから構成されます。色・余白・角丸・影・フォント・モーションをトークン化することで、テーマや密度の変更、ブランド色の差し替えに設計変更なしで耐えます。hex を直接書いた時点で、その UI はシステムの外にあります。'],
['4','Adaptive by default','Light / Dark / High contrast、Compact / Default / Comfortable、Primary color seed の変更に自然に対応します。「ダークモード対応」は後付けの作業ではなく、Semantic token を使っていれば自動的に成立する性質です。'],
['5','Accessible precision','アクセシビリティは後付けではなく、初期設計に含めます。フォーカスリング・キーボード操作・コントラスト比・色に依存しない状態表現を、すべてのコンポーネントの受け入れ条件とします。'],

</div></div>
<p>各層は一方向にのみ参照します。<b>Component は Semantic を、Semantic は Primitive を参照し、逆流しません。</b>これにより「テーマ変更 = Semantic 層のマッピング差し替え」で完結し、コンポーネント側の変更は不要になります。</p>

</ul>
<p>3 × 3 × N 通りの組み合わせすべてで UI が成立することを、コンポーネントの受け入れ条件とします。</p>
${h2('実装アーキテクチャ')}
${codeBlock(`:root(テーマ適用後)\n├─ Primitive   --primary-50 … --primary-950, --neutral-0 … 950\n├─ Semantic    --surface, --fg, --border, --primary, --danger …\n├─ Component   --button-primary-bg, --input-border, --sidebar-bg …\n├─ Size/Space  --ctl-md, --row-h, --card-pad(density で切替)\n└─ Motion      --dur-fast, --ease-standard`,'css','CSS variables layer')}
${h2('命名規則')}

${nextPrev(['overview/getting-started','Getting Started'],['foundations/color','Color'])}`)});

docPage('overview/for-designers',()=>shell(`
${head('Overview','For Designers','Meridian でデザインする際の実務ルールです。Figma 上での判断基準として使ってください。')}
${h2('色のルール')}
<ul class="plain">

<li>テキスト色は <code class="inline">foreground</code> / <code class="inline">foreground-muted</code> / <code class="inline">foreground-subtle</code> の 3 段のみ。第 4 のグレーを発明しない。</li>
<li>状態(成功・警告・危険)は色+アイコン+ラベルの 3 点セットで表現する。</li>
</ul>
${h2('アクションの優先度')}
<ul class="plain">
<li>Primary action は 1 画面に原則 1 つ。2 つ目からは Secondary / Ghost に落とす。</li>
<li>破壊的操作は Danger + 確認ダイアログ。並置するキャンセルは Ghost にする。</li>
</ul>
${h2('密度の選び方')}
<ul class="plain">
<li><b>Compact</b>: テーブル中心の管理画面、ログビューア、パワーユーザー向け</li>
<li><b>Default</b>: 迷ったらこれ。汎用的な SaaS 画面</li>
<li><b>Comfortable</b>: 設定・オンボーディング・タッチデバイス</li>
</ul>
${h2('コンポーネントの扱い')}
<ul class="plain">
<li>テンプレートをベースに設計する。ゼロから画面を組まない。</li>
<li>コンポーネントを detach して改造しない。要件に合わない場合はシステムへの追加を提案する。</li>
<li>例外が必要なときは、その値をトークン化してから使う(1 回限りのマジックナンバーを作らない)。</li>
</ul>
${h2('新規提案前のチェック(態度の一貫性)')}
<p>Meridian は<a href="#/overview/introduction">ミニマルという態度</a>を選んでいます。新しい画面・コンポーネントを提案する前に、次を自問してください。</p>
<ul class="plain">
<li>その装飾(影・グラデーション・大きな角丸)は、ユーザーの判断を速くするか? しないなら足さない。</li>

<li>ブランドを目立たせたい場面(ロゴ・アバター)以外で <code class="inline">accent</code> 色を使おうとしていないか? 状態や強調は Semantic token(<code class="inline">primary</code> / <code class="inline">success</code> / <code class="inline">warning</code> / <code class="inline">danger</code>)で表現する。</li>
<li>高密度な画面が欲しいだけなら、新しいコンポーネント群ではなく <a href="#/foundations/spacing">Density: Compact</a> で解決できないか、先に検討する。</li>

docPage('overview/for-engineers',()=>shell(`
${head('Overview','For Engineers','React + CSS Variables を前提とした実装ガイドです。')}
${h2('Installation')}
${codeBlock(`npm install @meridian/react @meridian/tokens\n# トークンのみ使う場合\nnpm install @meridian/tokens`,'bash','Terminal')}
${h2('Theme provider / Density provider')}
${codeBlock(`import { ThemeProvider } from "@meridian/react";\n\n<ThemeProvider\n  theme="dark"          // "light" | "dark" | "hc"\n  density="compact"     // "compact" | "default" | "comfortable"\n  seedColor="#6D5DF6"   // Dynamic color の基準色\n>\n  <App />\n</ThemeProvider>`,'tsx','providers.tsx')}
<p>Provider は <code class="inline">html</code> に <code class="inline">data-theme</code> / <code class="inline">data-density</code> を設定し、Seed から生成した CSS Variables を注入します。ネストして一部のサブツリーだけ別テーマにすることもできます。</p>
${h2('Component usage')}
${codeBlock(`<Button variant="primary" size="md">\n  Create project\n</Button>\n\n<TextField\n  label="Project name"\n  placeholder="Acme Dashboard"\n  helperText="Use a clear, recognizable name."\n/>`,'tsx','usage.tsx')}
${h2('Dark mode / Dynamic seed の切替')}
${codeBlock(`const { setTheme, setSeedColor } = useTheme();\n\n<Switch\n  label="ダークモード"\n  checked={theme === "dark"}\n  onChange={(on) => setTheme(on ? "dark" : "light")}\n/>\n\n// ワークスペースのブランド色を反映\nuseEffect(() => setSeedColor(workspace.brandColor), [workspace]);`,'tsx','theme-switch.tsx')}
${h2('Tailwind mapping')}
<p>Tailwind v4 を使う場合、Semantic token を <code class="inline">@theme</code> にマッピングします。ユーティリティ名からも Primitive を排除します。</p>
${codeBlock(`@import "tailwindcss";\n@import "@meridian/tokens/css";\n\n@theme inline {\n  --color-background: var(--bg);\n  --color-surface: var(--surface);\n  --color-foreground: var(--fg);\n  --color-muted: var(--fg-muted);\n  --color-border: var(--border);\n  --color-primary: var(--primary);\n  --color-primary-foreground: var(--primary-fg);\n  --radius-md: var(--radius-md);\n}\n/* 使用例: bg-surface text-foreground border-border rounded-md */`,'css','globals.css')}
${h2('CSS を直接書く場合')}
${codeBlock(`.deploy-card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  padding: var(--card-pad); /* density に自動連動 */\n  color: var(--fg);\n}\n.deploy-card:hover { border-color: var(--border-strong); }`,'css','deploy-card.css')}
${h2('Token export')}
${codeBlock(`import { exportTokens } from "@meridian/tokens";\n\nconst json = exportTokens({ theme: "dark", seed: "#6D5DF6" });\n// → W3C Design Tokens 形式の JSON(Figma Variables 互換)`,'tsx','export.ts')}
${h2('態度の一貫性チェックリスト(PR レビュー時)')}
<p>Meridian は<a href="#/overview/introduction">ミニマルという態度</a>を選んでいます。レビューでは実装がこれを裏切っていないかを機械的に確認できます。</p>
<ul class="plain">
<li><code class="inline">border-radius</code> / <code class="inline">box-shadow</code> / <code class="inline">transition</code> に raw な px・ms 値を書いていないか(必ず <code class="inline">var(--radius-*)</code> / <code class="inline">var(--shadow-*)</code> / <code class="inline">var(--dur-*)</code> を参照する)</li>
<li>静的な Card / Panel に <code class="inline">box-shadow</code> を追加していないか(浮遊レイヤー以外は border のみ、<a href="#/foundations/elevation">Elevation & Border</a> 参照)</li>
<li><code class="inline">var(--accent)</code> をブランドマーク以外(ボタン・バッジ・強調テキストなど)に使っていないか</li>
<li>高密度な画面を理由に、新しいコンポーネントを増やしていないか(<code class="inline">density="compact"</code> で解決できないか先に検討する)</li>
</ul>
${h2('Accessibility checklist(実装時)')}
<ul class="plain">
<li>インタラクティブ要素はネイティブ要素(button / a / input)を優先する</li>
<li><code class="inline">:focus-visible</code> のリングを消さない(<code class="inline">--focus-ring</code> を使う)</li>
<li>Icon only のコントロールに aria-label</li>
<li>Dialog はフォーカストラップ+復帰、Esc で閉じる</li>
<li>動きは <code class="inline">prefers-reduced-motion</code> で無効化(トークン側で対応済み)</li>
</ul>
${nextPrev(['overview/for-designers','For Designers'],['foundations/color','Color'])}`));

${head('Foundations','Color','1 つの基準色(Seed color)から、OKLCH 色空間で 9 系統の Primitive palette と 40+ の Semantic token を自動生成するカラーシステムです。')}
${h2('カラーシステムの目的')}
<ul class="plain">
<li>ブランドカラーを UI 全体へ自然に展開する(逐一の手調整をなくす)</li>
<li>Light / Dark / High contrast で破綻しない(WCAG コントラスト比を自動的に満たすよう調整される生成スケール)</li>
<li>表示用途ごとに Semantic color を使い、実装時に hex を直接使わない</li>
<li>UI の状態を色だけに頼らず、線・ラベル・アイコンでも補助する</li>
<li>ユーザー・テナントが Primary color seed を変更できる</li>
</ul>
${h2('Seed color')}
<p>Seed はユーザーまたはブランドが選択する基準色です。内部ではまず Seed を OKLCH(知覚的に均一な明度 L・彩度 C・色相 H で色を表す空間)に変換し、そこから全スケールを導出します。HSL と違い、OKLCH の L は色相が変わっても同じ数値なら同じ明るさに見えるため、どんな Seed を選んでも一貫した見え方のスケールになります。Neutral は Seed の色相をわずかに帯びた無彩色になり、画面全体の統一感につながります。</p>
<div class="panel pad">
<div class="rowflex" style="margin-bottom:var(--sp-3)">
${SEED_PRESETS.map(s=>`<button class="seeddot" style="background:${s.hex}" data-seed="${s.hex}" aria-pressed="${STATE.seed.toLowerCase()===s.hex.toLowerCase()}" title="${s.name}" aria-label="Seed: ${s.name}"></button>`).join('')}
<label class="rowflex" style="gap:8px;margin-left:8px;font-size:var(--text-small);color:var(--fg-muted)">Custom
<input type="color" value="${STATE.seed}" data-seedpick style="width:34px;height:26px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:2px;cursor:pointer"></label>
<code class="inline" style="margin-left:auto">${STATE.seed}</code></div>
<p class="muted" style="font-size:var(--text-small);margin:0">Seed を選ぶと、このサイト全体(Primitive・Semantic・Component・Chart)が即座に再生成されます。</p>
</div>
${h2('Primitive palette')}
<p>Seed から生成される 50–950 の 11 段スケールです。明度(OKLCH L)は色相に関わらず同じカーブを使うため、どの色相のスケールでも段ごとの明るさが揃って見えます。彩度(OKLCH C)は明暗の両端で自動的に減衰させ、sRGB の外に出る組み合わせはガマットマッピングで表示可能な範囲へ丸めるため、どんな Seed でも破綻した色は出力されません。クリックで hex をコピーできます。</p>
<div class="panel pad" style="overflow-x:auto">
${palRow('primary',P.primary)}${palRow('secondary',P.secondary)}${palRow('accent',P.accent)}${palRow('neutral',P.neutral)}${palRow('neutral-var',P.neutralVariant)}${palRow('success',P.success)}${palRow('warning',P.warning)}${palRow('danger',P.danger)}${palRow('info',P.info)}
</div>
${h2('Accent の使用範囲')}
<p><code class="inline">accent</code> は Primary とは別軸の第 2 色相で、ロゴマークやアバターのグラデーションなど<b>ブランドアイデンティティ表現専用</b>のトークンです。ボタン・バッジ・強調テキストなど一般的な UI の配色には使用しません。強調や状態の表現は Semantic token(<code class="inline">primary</code> / <code class="inline">success</code> / <code class="inline">warning</code> / <code class="inline">danger</code>)を使ってください。</p>

${h2('Semantic tokens')}

</tbody></table></div>

${h2('Contrast checker')}

${h2('Data visualization colors')}

docPage('foundations/typography',()=>shell(`

${[['Body','13px','14px','15px'],['Label','12px','13px','14px'],['Table text','12px','13px','14px'],['Line-height','1.45','1.55','1.65']].map(r=>`<tr><td style="font-weight:550">${r[0]}</td><td class="mono">${r[1]}</td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td></tr>`).join('')}

docPage('foundations/motion',()=>shell(`

  return `<tr><td class="mono">${name}</td><td style="color:var(--fg-muted)">${m[1]}<div style="font-size:10.5px;color:var(--fg-subtle)">${m[2]}</div></td><td>${cell(L[k])}</td><td>${cell(D[k])}</td><td>${cell(H[k])}</td><td><button class="cp" data-copy="var(${name})">${I.copy}</button></td></tr>`}).join('')}

    return shell(`

function tplShell(vp,side,main,topExtra=''){
  const narrow=vp==='mobile';
  return `<div class="tpl-shell ${narrow?'narrow':''}">
  ${narrow?'':`<aside class="tpl-side">${side}</aside>`}
  <div class="tpl-main">
    <div class="tpl-top">${narrow?`<button class="tb-btn" aria-label="メニュー">${I.menu}</button>`:''}${topExtra}</div>
    <div class="tpl-body">${main}</div>
  </div></div>`}
function tplSide(active){
  const it=(ic,l,on,b)=>`<div class="tsb-item ${on?'on':''}">${ic} ${l}${b?`<span style="margin-left:auto;font-size:9.5px;background:var(--primary-subtle);color:var(--primary);padding:0 6px;border-radius:var(--radius-full);font-weight:600">${b}</span>`:''}</div>`;
  return `<button class="tsb-item" style="font-weight:600;width:100%;margin-bottom:6px">${avatar({name:'AC',size:'xs'})} Acme Inc. <span style="margin-left:auto">${I.chevD}</span></button>
  <div class="tsb-hd">Workspace</div>
  ${it(I.zap,'ダッシュボード',active==='dash')}${it(I.folder,'プロジェクト',active==='proj','12')}${it(I.file,'Issues',active==='issues','48')}${it(I.spark,'AI Workspace',active==='ai')}

let PG={};
function pgDefaults(c){const p={};
  if(c.variants)p.variant=c.variants[0];

  p.state='default';

  if(c.variants)s+=opt('variant',c.variants,PG.variant);

  stage.parentElement.dataset.bg=PG._bg;
  const code=$('#pg-code');if(code){const src=c.code(PG);code.innerHTML=`<div class="codeblock"><div class="cb-hd">Usage<button class="cp" data-copy="${esc(src)}">${I.copy} Copy</button></div><pre><code>${hl(src,'tsx')}</code></pre></div>`}
  const cmp=$('#pg-compare');if(cmp){cmp.innerHTML=[['light','Light'],['dark','Dark'],['hc','High contrast']].map(([th,l])=>{const t=buildSemantics(PALETTES,th);return `<div style="${themeVars(th)};background:${t.background};color:${t.foreground}"><span class="cl" style="color:${t['foreground-subtle']}">${l}</span>${c.render(PG)}</div>`}).join('')}
}
function playground(c){
  return `<div class="pg" id="pg-root">
  <div class="pg-top">
    <div class="pg-preview" data-bg="${PG._bg}"><div id="pg-stage" style="max-width:100%">${c.render(PG)}</div></div>
    <div class="pg-controls" id="pg-ctl">${pgControls(c)}</div>
  </div>
  <div class="pg-code" id="pg-code"></div>
  <div class="pg-compare" id="pg-compare"></div>
  <div class="pg-tokens"><div class="t">Tokens used</div><div class="rowflex">${c.tokens.map(t=>`<button class="tokchip" data-copy="var(${t.startsWith('--')?t:'--'+t})">${t}</button>`).join('')}</div></div>
  </div>`}

function componentPage(c){
  const li=a=>a.map(x=>`<li>${x}</li>`).join('');
  const statesRow=c.states&&c.states.length>1?`${h2('States')}<div class="panel pad" style="display:flex;gap:var(--sp-5);flex-wrap:wrap;align-items:flex-start;background:var(--bg-subtle)">${c.states.map(st=>`<div style="text-align:center"><div style="margin-bottom:8px">${c.render({...pgDefaults(c),state:st})}</div><code class="inline" style="font-size:10px">${st}</code></div>`).join('')}</div>`:'';
  const variantsRow=c.variants?`${h2('Variants')}<div class="panel pad" style="display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:flex-start;background:var(--bg-subtle)">${c.variants.map(v=>`<div style="text-align:center"><div style="margin-bottom:8px">${c.render({...pgDefaults(c),variant:v})}</div><code class="inline" style="font-size:10px">${v}</code></div>`).join('')}</div>`:'';
  const sizesRow=c.sizes?`${h2('Sizes')}<div class="panel pad" style="display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:center;background:var(--bg-subtle)">${c.sizes.map(v=>`<div style="text-align:center"><div style="margin-bottom:8px">${c.render({...pgDefaults(c),size:v})}</div><code class="inline" style="font-size:10px">${v}</code></div>`).join('')}</div>`:'';
  const props=[];
  if(c.variants)props.push(['variant',c.variants.map(v=>`"${v}"`).join(' | '),`"${c.variants[0]}"`,'見た目のバリアント']);
  if(c.sizes)props.push(['size',c.sizes.map(v=>`"${v}"`).join(' | '),'"md"','サイズ']);
  if((c.states||[]).includes('disabled'))props.push(['disabled','boolean','false','操作不可(送信対象外)']);
  if((c.states||[]).includes('loading'))props.push(['loading','boolean','false','読み込み中表示']);
  (c.texts||[]).forEach(([k,l])=>props.push([k,'string','—',l]));
  (c.flags||[]).forEach(([k,l])=>props.push([k,'boolean','false',l]));
  const dodont=(c.dos||c.donts)?`${h2("Do / Don't")}<div class="dodont">
    ${(c.dos||[]).map(([fn,t])=>`<div class="box do"><div class="cap">${I.check} Do</div><div class="bd">${fn()}</div><div class="tx">${t}</div></div>`).join('')}
    ${(c.donts||[]).map(([fn,t])=>`<div class="box dont"><div class="cap">${I.x} Don't</div><div class="bd">${fn()}</div><div class="tx">${t}</div></div>`).join('')}
  </div>`:'';
  return shell(`
${head('Components · '+c.group,c.name,c.desc)}
${playground(c)}
${c.anatomy?`${h2('Anatomy')}<ul class="plain">${li(c.anatomy.map(a=>`<b>${a[0]}.</b> ${a[1]}`))}</ul>`:''}
${c.when?`${h2('When to use')}<ul class="plain">${li(c.when)}</ul>`:''}
${c.notWhen?`${h2('When not to use')}<ul class="plain">${li(c.notWhen)}</ul>`:''}
${c.usage?`${h2('Usage')}<ul class="plain">${li(c.usage)}</ul>`:''}
${variantsRow}${sizesRow}${statesRow}
${props.length?`${h2('Props / API')}<div class="tscroll"><table class="ttable"><thead><tr><th>Prop</th><th>Type</th><th>Default</th><th>説明</th></tr></thead><tbody>${props.map(p=>`<tr><td class="mono">${p[0]}</td><td class="mono" style="font-size:11px;color:var(--fg-muted)">${esc(p[1])}</td><td class="mono">${esc(p[2])}</td><td style="color:var(--fg-muted)">${p[3]}</td></tr>`).join('')}</tbody></table></div>`:''}
${h2('Design tokens')}<div class="rowflex" style="gap:6px">${c.tokens.map(t=>`<button class="tokchip" data-copy="var(${t.startsWith('--')?t:'--'+t})">${t}</button>`).join('')}</div>
${h2('Accessibility')}<ul class="plain">${li(c.a11y)}</ul>
${c.keys?`${h2('Keyboard interaction')}<div class="tscroll"><table class="ttable"><thead><tr><th style="width:180px">Key</th><th>Action</th></tr></thead><tbody>${c.keys.map(k=>`<tr><td><kbd style="border:1px solid var(--border);border-radius:var(--radius-2xs);padding:1px 7px;font-size:11px;background:var(--surface-muted)">${k[0]}</kbd></td><td style="color:var(--fg-muted)">${k[1]}</td></tr>`).join('')}</tbody></table></div>`:''}
${dodont}
${h2('Responsive behavior')}
<p class="muted" style="font-size:var(--text-label)">サイズ・余白は density トークンに連動し、タッチ環境では Comfortable 密度でヒット領域 40px 以上を確保します。モバイル幅では full width 配置を推奨します。</p>
${c.related.length?`${h2('Related components')}<div class="rowflex">${c.related.map(r=>CMAP[r]?`<a class="btn" data-variant="secondary" data-size="sm" href="#/components/${r}">${CMAP[r].name}</a>`:PAGES['foundations/'+r]?`<a class="btn" data-variant="secondary" data-size="sm" href="#/foundations/${r}">${r}</a>`:PAGES['templates/'+r]||PAGES['patterns/'+r]?`<a class="btn" data-variant="secondary" data-size="sm" href="#/${PAGES['templates/'+r]?'templates':'patterns'}/${r}">${r}</a>`:'').join('')}</div>`:''}
`)}
for(const c of COMPONENTS){docPage('components/'+c.id,()=>componentPage(c))}

/* ============ Navigation model ============ */
const COMP_GROUPS=['Core','Forms','Navigation','Feedback','Data Display','AI & Developer','SaaS'];
const NAV=[
 {label:'Overview',items:[['overview/introduction','Introduction'],['overview/principles','Principles'],['overview/getting-started','Getting Started'],['overview/architecture','System Architecture'],['overview/for-designers','For Designers'],['overview/for-engineers','For Engineers']]},
 {label:'Foundations',items:[['foundations/color','Color'],['foundations/typography','Typography'],['foundations/spacing','Spacing'],['foundations/layout','Layout'],['foundations/radius','Radius'],['foundations/elevation','Elevation'],['foundations/motion','Motion'],['foundations/iconography','Iconography'],['foundations/accessibility','Accessibility'],['foundations/content','Content Guidelines']]},
 {label:'Tokens',items:[['tokens/overview','Token Overview'],['tokens/color','Color Tokens'],['tokens/typography','Typography Tokens'],['tokens/spacing','Spacing Tokens'],['tokens/radius','Radius Tokens'],['tokens/shadow','Shadow Tokens'],['tokens/motion','Motion Tokens'],['tokens/component','Component Tokens'],['tokens/theme','Theme Tokens'],['tokens/density','Density Tokens'],['tokens/css-variables','CSS Variables'],['tokens/json-tokens','JSON Tokens']]},
 ...COMP_GROUPS.map(g=>({label:g==='Core'?'Components · Core':g,comp:true,items:COMPONENTS.filter(c=>c.group===g).map(c=>['components/'+c.id,c.name])})),
 {label:'Patterns',items:Object.entries(PATTERNS).map(([id,p])=>['patterns/'+id,p.t])},
 {label:'Templates',items:Object.entries(TEMPLATES).map(([id,t])=>['templates/'+id,t.name])},
 {label:'Resources',items:[['resources/figma-tokens','Figma Tokens'],['resources/css-variables','CSS Variables'],['resources/react-usage','React Usage'],['resources/tailwind-usage','Tailwind Usage'],['resources/design-handoff','Design Handoff'],['resources/a11y-checklist','A11y Checklist'],['resources/contribution','Contribution Guide'],['resources/changelog','Changelog']]}
];
const ALL_LINKS=NAV.flatMap(g=>g.items.map(it=>({route:it[0],label:it[1],group:g.label})));
function findLabel(route){const f=ALL_LINKS.find(l=>l.route===route);return f?f:{label:'Home',group:''}}

/* ============ Shell ============ */
const openGroups=new Set(['Overview','Foundations','Components · Core']);
function renderSidebar(){
  const cur=STATE.route;
  return `<div class="sb-logo"><span class="mark"></span>Meridian<span class="ver">v2.4.1</span></div>
  <button class="sb-search" data-opencmd>${I.search}<span>検索 / コマンド</span><kbd>⌘K</kbd></button>
  <a class="sb-item" href="#/home" aria-current="${cur==='home'?'page':'false'}" style="margin:0 var(--sp-1)">${I.zap} ホーム</a>
  ${NAV.map(g=>{
    const open=openGroups.has(g.label)||g.items.some(it=>it[0]===cur);
    return `<div class="sb-group ${open?'':'closed'}" data-group="${esc(g.label)}">
    <button class="hd">${I.chevD}<span>${esc(g.label)}</span><span style="margin-left:auto;font-weight:500;letter-spacing:0">${g.items.length}</span></button>
    <div class="items" style="margin:2px var(--sp-1) 0">${g.items.map(it=>`<a class="sb-item" href="#/${it[0]}" aria-current="${it[0]===cur?'page':'false'}">${esc(it[1])}</a>`).join('')}</div></div>`}).join('')}`}
function renderTopbar(){
  const meta=STATE.route==='home'?{label:'Home',group:''}:findLabel(STATE.route);
  return `<button class="tb-btn mob-nav-btn" data-navtoggle aria-label="ナビゲーション">${I.menu}</button>
  <div class="tb-crumb">${meta.group?`<span>${esc(meta.group)}</span><span>${I.chevR}</span>`:''}<b>${esc(meta.label)}</b></div>
  <div class="tb-right">
  <button class="tb-btn hide-m" data-cycletheme title="テーマ切替 (Light / Dark / HC)">${STATE.theme==='light'?I.sun:STATE.theme==='dark'?I.moon:I.contrast}<span style="font-size:11px">${STATE.theme==='hc'?'HC':STATE.theme[0].toUpperCase()+STATE.theme.slice(1)}</span></button>
  <button class="tb-btn hide-m" data-opensettings title="Density">${I.density}<span style="font-size:11px">${STATE.density[0].toUpperCase()+STATE.density.slice(1)}</span></button>
  <button class="tb-btn" data-opensettings title="Seed color"><span class="tb-seed"></span></button>
  <button class="tb-btn bordered hide-m" title="Version"><span style="font-family:var(--font-mono);font-size:10.5px">v2.4.1</span>${I.chevD}</button>
  <a class="tb-btn" href="#/resources/react-usage" title="実装ガイド">${I.code}</a>
  <a class="tb-btn hide-m" href="#/resources/changelog" title="GitHub">${I.github}</a>
  <button class="tb-btn" data-opensettings aria-label="設定"><span class="tb-avatar">SN</span></button>
  </div>`}
function settingsMenu(){
  return `<div class="tb-menu" id="tb-menu" role="menu">
  <h4>Theme</h4><div class="seg" style="width:100%">${[['light','Light'],['dark','Dark'],['hc','High contrast']].map(([v,l])=>`<button style="flex:1" aria-pressed="${STATE.theme===v}" data-settheme="${v}">${l}</button>`).join('')}</div>
  <h4>Density</h4><div class="seg" style="width:100%">${[['compact','Compact'],['default','Default'],['comfortable','Comfortable']].map(([v,l])=>`<button style="flex:1" aria-pressed="${STATE.density===v}" data-setdensity="${v}">${l}</button>`).join('')}</div>
  <h4>Primary color seed</h4><div class="rowflex" style="gap:6px">${SEED_PRESETS.map(s=>`<button class="seeddot" style="background:${s.hex};width:22px;height:22px" data-seed="${s.hex}" aria-pressed="${STATE.seed.toLowerCase()===s.hex.toLowerCase()}" title="${s.name}" aria-label="Seed ${s.name}"></button>`).join('')}<input type="color" value="${STATE.seed}" data-seedpick style="width:28px;height:22px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:1px;cursor:pointer" aria-label="Custom seed"></div>
  <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-muted);font-size:var(--text-micro);color:var(--fg-subtle)">設定はサイト全体に即時反映され、保存されます。</div>
  </div>`}

function renderApp(){
  const app=$('#app');
  app.className='app'+(STATE.navOpen?' nav-open':'');
  app.innerHTML=`<aside class="sidebar" id="sidebar" aria-label="サイトナビゲーション">${renderSidebar()}</aside>
  <div class="main"><header class="topbar" id="topbar">${renderTopbar()}</header><main class="content" id="content"></main></div>`;
  renderRoute();
}
function renderRoute(){
  H2N=0;
  const fn=PAGES[STATE.route]||PAGES['home'];
  $('#content').innerHTML=fn();
  buildToc();
  const c=STATE.route.startsWith('components/')?CMAP[STATE.route.split('/')[1]]:null;
  if(c)pgRefresh(c);
}
function buildToc(){
  const toc=$('#toc');if(!toc)return;
  const hs=$$('#doc-body h2');
  if(hs.length<2){toc.style.display='none';return}
  toc.innerHTML='<div class="t">On this page</div>'+hs.map(h=>`<a href="#${''}" data-scroll="${h.id}">${h.textContent}</a>`).join('');
}
function navigate(route){
  if(!PAGES[route])route='home';
  STATE.route=route;STATE.navOpen=false;
  const c=route.startsWith('components/')?CMAP[route.split('/')[1]]:null;
  if(c)PG=pgDefaults(c);
  renderApp();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const r=location.hash.replace(/^#\//,'')||'home';if(r!==STATE.route)navigate(r)});

/* ============ Command menu ============ */
let cmdSel=0,cmdItems=[];
function openCmd(){
  const root=$('#overlay-root');
  root.innerHTML=`<div class="ovl" data-closecmd><div class="cmdk" role="dialog" aria-label="コマンドメニュー" onclick="event.stopPropagation()">
  <div class="ci">${I.search}<input id="cmd-input" placeholder="ページ・コンポーネントを検索…" autocomplete="off"><kbd style="font-size:10px;color:var(--fg-subtle);border:1px solid var(--border);border-radius:var(--radius-2xs);padding:1px 5px">esc</kbd></div>
  <div class="list" id="cmd-list"></div></div></div>`;
  cmdFilter('');
  const inp=$('#cmd-input');inp.focus();
  inp.addEventListener('input',()=>cmdFilter(inp.value));
}
function closeCmd(){$('#overlay-root').innerHTML=''}
function cmdFilter(q){
  q=q.trim().toLowerCase();
  const acts=[
    {label:'テーマを切替 (Light → Dark → HC)',k:'T',run:()=>cycleTheme(),group:'アクション'},
    {label:'密度を切替 (Compact → Default → Comfortable)',k:'D',run:()=>cycleDensity(),group:'アクション'},
  ];
  const pages=ALL_LINKS.filter(l=>!q||l.label.toLowerCase().includes(q)||l.route.includes(q)||l.group.toLowerCase().includes(q)).slice(0,14).map(l=>({label:l.label,k:l.group,run:()=>{location.hash='#/'+l.route},group:'ページ'}));
  cmdItems=[...(!q?acts:acts.filter(a=>a.label.toLowerCase().includes(q))),...pages];
  cmdSel=0;
  const list=$('#cmd-list');
  if(!cmdItems.length){list.innerHTML=`<div class="empty">「${esc(q)}」に一致する結果がありません。<br><span style="font-size:11px">例: button, color, dashboard</span></div>`;return}
  let html='',lastG='';
  cmdItems.forEach((it,i)=>{if(it.group!==lastG){html+=`<div class="ghd">${it.group}</div>`;lastG=it.group}
    html+=`<button class="it ${i===cmdSel?'sel':''}" data-cmdi="${i}">${it.group==='アクション'?I.zap:I.file}${esc(it.label)}<span class="k">${esc(it.k)}</span></button>`});
  list.innerHTML=html;
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmd-input')?closeCmd():openCmd();return}
  if(!$('#cmd-input'))return;
  if(e.key==='Escape'){closeCmd()}
  else if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdSel+1,cmdItems.length-1);paintSel()}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(cmdSel-1,0);paintSel()}
  else if(e.key==='Enter'){e.preventDefault();const it=cmdItems[cmdSel];if(it){closeCmd();it.run()}}
});
function paintSel(){$$('#cmd-list .it').forEach((el,i)=>el.classList.toggle('sel',i===cmdSel))}

/* ============ Global interactions ============ */
function cycleTheme(){STATE.theme=STATE.theme==='light'?'dark':STATE.theme==='dark'?'hc':'light';refreshAll()}
function cycleDensity(){STATE.density=STATE.density==='compact'?'default':STATE.density==='default'?'comfortable':'compact';refreshAll()}
function refreshAll(){
  const y=window.scrollY;
  applyTheme();renderApp();window.scrollTo(0,y);
}
document.addEventListener('click',e=>{
  const t=e.target;
  const seed=t.closest('[data-seed]');if(seed){STATE.seed=seed.dataset.seed;refreshAll();return}
  const th=t.closest('[data-settheme]');if(th){STATE.theme=th.dataset.settheme;refreshAll();return}
  const dn=t.closest('[data-setdensity]');if(dn){STATE.density=dn.dataset.setdensity;refreshAll();return}
  if(t.closest('[data-cycletheme]')){cycleTheme();return}
  if(t.closest('[data-cycledensity]')){cycleDensity();return}
  if(t.closest('[data-opencmd]')){openCmd();return}
  if(t.closest('[data-closecmd]')&&!t.closest('.cmdk')){closeCmd();return}
  const ci=t.closest('[data-cmdi]');if(ci){const it=cmdItems[+ci.dataset.cmdi];closeCmd();if(it)it.run();return}
  if(t.closest('[data-navtoggle]')){STATE.navOpen=!STATE.navOpen;$('#app').classList.toggle('nav-open',STATE.navOpen);return}
  const gh=t.closest('.sb-group>.hd');if(gh){const g=gh.parentElement;const name=g.dataset.group;g.classList.toggle('closed');g.classList.contains('closed')?openGroups.delete(name):openGroups.add(name);return}
  const os=t.closest('[data-opensettings]');if(os){const ex=$('#tb-menu');if(ex){ex.remove()}else{$('#topbar').insertAdjacentHTML('beforeend',settingsMenu())}return}
  if(!t.closest('#tb-menu')&&!t.closest('[data-opensettings]')){const m=$('#tb-menu');if(m)m.remove()}
  const sc=t.closest('[data-scroll]');if(sc){e.preventDefault();const el=document.getElementById(sc.dataset.scroll);if(el)el.scrollIntoView({behavior:'smooth'});return}
  const vp=t.closest('[data-vp]');if(vp){$$('#tpl-vp-seg [data-vp]').forEach(b=>b.setAttribute('aria-pressed',b===vp));const v=vp.dataset.vp;const frame=$('#tpl-vp');if(frame){frame.style.maxWidth=v==='mobile'?'390px':v==='tablet'?'768px':'100%';const tid=STATE.route.split('/')[1];frame.innerHTML=TEMPLATES[tid].fn(v)}return}
  /* playground */
  const po=t.closest('[data-pg]');if(po){PG[po.dataset.pg]=po.dataset.val;$$('#pg-ctl [data-pg="'+po.dataset.pg+'"]').forEach(b=>b.setAttribute('aria-pressed',b===po));const c=CMAP[STATE.route.split('/')[1]];if(c)pgRefresh(c);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-seedpick]')){STATE.seed=t.value;refreshAll();return}
  if(t.matches('[data-pgflag]')){PG[t.dataset.pgflag]=t.checked;const c=CMAP[STATE.route.split('/')[1]];if(c)pgRefresh(c);return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-pgtext]')){PG[t.dataset.pgtext]=t.value;const c=CMAP[STATE.route.split('/')[1]];if(c){const stage=$('#pg-stage');if(stage)stage.innerHTML=c.render(PG);const code=$('#pg-code pre code');if(code)code.innerHTML=hl(c.code(PG),'tsx');const cmp=$('#pg-compare');if(cmp)pgRefresh(c)}return}
});

/* ============ Boot ============ */
applyTheme();
STATE.route=location.hash.replace(/^#\//,'')||'home';
if(!PAGES[STATE.route])STATE.route='home';
{const c=STATE.route.startsWith('components/')?CMAP[STATE.route.split('/')[1]]:null;if(c)PG=pgDefaults(c)}
renderApp();
</script>
</body>
</html>
