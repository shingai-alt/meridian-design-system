<!doctype html>
<html lang="ja" data-theme="light" data-density="default" data-seed="#7856D6">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チャット — Meridian example</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/build/tokens.css">
<script src="../src/color-engine.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--lh-normal);color:var(--fg);background:var(--bg)}
:focus{outline:none}
:focus-visible{outline:var(--focus-w) solid var(--focus-ring);outline-offset:2px;border-radius:var(--radius-2xs)}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
@media(max-width:640px){.app{grid-template-columns:1fr}.convlist{display:none}}
.convlist{border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-subtle)}
.convlist-hd{font-size:var(--text-body);font-weight:650;padding:var(--sp-4) var(--sp-4) var(--sp-3)}
.searchbox{margin:0 var(--sp-3) var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);height:var(--ctl-sm);padding:0 var(--sp-2);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
.searchbox input{border:none;background:none;outline:none;font:inherit;font-size:var(--text-label);color:var(--fg);width:100%}
.searchbox input::placeholder{color:var(--fg-subtle)}
.convs{flex:1;overflow-y:auto}
.conv-item{display:flex;align-items:center;gap:var(--sp-2);width:100%;padding:var(--sp-2) var(--sp-3);border:none;background:none;text-align:left;cursor:pointer}
.conv-item:hover{background:var(--surface-muted)}
.conv-item[data-active="true"]{background:var(--primary-subtle)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-muted);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:var(--text-small);font-weight:600;flex:none;position:relative}
.avatar .dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid var(--bg-subtle)}
.conv-body{flex:1;min-width:0}
.conv-toprow{display:flex;justify-content:space-between;align-items:baseline}
.conv-name{font-size:var(--text-label);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:var(--text-micro);color:var(--fg-subtle);flex:none;margin-left:var(--sp-2)}
.conv-preview{font-size:var(--text-small);color:var(--fg-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:var(--sp-1)}
.unread{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-full);background:var(--primary);color:var(--primary-fg);font-size:var(--text-micro);font-weight:600;flex:none}
.chatmain{display:flex;flex-direction:column;min-width:0}
.chat-topbar{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border)}
.chat-topbar .name{font-size:var(--text-label);font-weight:600}
.chat-topbar .status{font-size:var(--text-small);color:var(--fg-subtle)}
.chat-topbar .spacer{flex:1}
.icnbtn{width:var(--ctl-sm);height:var(--ctl-sm);border-radius:var(--radius-sm);border:none;background:none;color:var(--fg-muted);font-size:16px;cursor:pointer}
.icnbtn:hover{background:var(--surface-muted);color:var(--fg)}
.messages{flex:1;overflow-y:auto;padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2)}
.daydivider{text-align:center;font-size:var(--text-micro);color:var(--fg-subtle);margin:var(--sp-3) 0}
.msg{display:flex;max-width:64%;gap:var(--sp-2)}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end;flex-direction:row-reverse}
.msg .bubble{padding:var(--sp-2) var(--sp-3);border-radius:var(--radius-lg);font-size:var(--text-label)}
.msg.in .bubble{background:var(--surface-muted);color:var(--fg);border-bottom-left-radius:var(--radius-2xs)}
.msg.out .bubble{background:var(--primary);color:var(--primary-fg);border-bottom-right-radius:var(--radius-2xs)}
.msg .time{font-size:var(--text-micro);color:var(--fg-subtle);align-self:flex-end;margin-bottom:2px;white-space:nowrap}
.composer{display:flex;align-items:flex-end;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border)}
.composer textarea{flex:1;resize:none;max-height:120px;border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-2) var(--sp-3);font:inherit;font-size:var(--text-label);color:var(--fg);background:var(--surface);transition:border-color var(--dur-fast) var(--ease-standard)}
.composer textarea:focus-visible{border-color:var(--primary)}
.sendbtn{width:var(--ctl-lg);height:var(--ctl-lg);border-radius:var(--radius-full);border:none;background:var(--primary);color:var(--primary-fg);font-size:16px;cursor:pointer;flex:none;transition:background var(--dur-fast) var(--ease-standard)}
.sendbtn:hover{background:var(--primary-hover)}
</style>
</head>
<body>
<div class="app">
  <aside class="convlist">
    <div class="convlist-hd">チャット</div>
    <div class="searchbox"><input type="search" placeholder="検索" aria-label="会話を検索"></div>
    <nav class="convs" id="conv-list" aria-label="会話一覧"></nav>
  </aside>

  <main class="chatmain">
    <header class="chat-topbar">
      <span class="avatar">田</span>
      <div><div class="name">田中 美咲</div><div class="status">オンライン</div></div>
      <div class="spacer"></div>
      <button class="icnbtn" aria-label="通話">📞</button>
      <button class="icnbtn" aria-label="詳細情報">ⓘ</button>
    </header>

    <div class="messages" id="messages">
      <div class="daydivider">今日</div>
    </div>

    <form class="composer" id="composer">
      <textarea rows="1" placeholder="メッセージを入力…" aria-label="メッセージ入力"></textarea>
      <button type="submit" class="sendbtn" aria-label="送信">➤</button>
    </form>
  </main>
</div>
<script>
(function () {
  var root = document.documentElement;
  // Seed は <html data-seed> に置く(design/rules.json の構造的例外)。
  var theme = root.dataset.theme, density = root.dataset.density, seed = root.dataset.seed;
  var P = buildPalettes(seed);
  var T = buildSemantics(P, theme);
  var st = root.style;
  for (var k in T) st.setProperty('--' + k, T[k]);
  st.setProperty('--fg', T.foreground);
  st.setProperty('--bg', T.background);

  var convs = [
    ['田中 美咲', 'いいですね、じゃあ木曜で!', '2分前', 0, true, true],
    ['佐藤 健太', '資料ありがとうございます 🙏', '14分前', 2, false, true],
    ['design-team', '山田: リリースノート更新しました', '1時間前', 0, false, false],
    ['Rin Nakamura', '了解です、確認します', '昨日', 0, false, false]
  ];
  document.getElementById('conv-list').innerHTML = convs.map(function (c, i) {
    var name = c[0], preview = c[1], time = c[2], unread = c[3], active = c[4], online = c[5];
    return '<button class="conv-item" data-active="' + active + '">' +
      '<span class="avatar">' + name.slice(0, 1) + (online ? '<span class="dot"></span>' : '') + '</span>' +
      '<div class="conv-body"><div class="conv-toprow"><span class="conv-name">' + name + '</span>' +
        '<span class="conv-time">' + time + '</span></div>' +
        '<div class="conv-preview"><span>' + preview + '</span>' +
        (unread ? '<span class="unread">' + unread + '</span>' : '') + '</div></div>' +
      '</button>';
  }).join('');

  var messages = [
    ['in', 'こんにちは!来週のミーティングの件で相談したいことがあって。', '10:02'],
    ['out', 'はい、大丈夫です。何かありましたか?', '10:03'],
    ['in', '木曜の午前中に変更できますか?午後は別件が入ってしまって…', '10:05'],
    ['out', 'いいですね、じゃあ木曜で!', '10:06']
  ];
  var msgHtml = messages.map(function (m) {
    var role = m[0], text = m[1], time = m[2];
    return '<div class="msg ' + role + '"><div class="bubble">' + text + '</div><span class="time">' + time + '</span></div>';
  }).join('');
  document.getElementById('messages').insertAdjacentHTML('beforeend', msgHtml);

  document.getElementById('composer').addEventListener('submit', function (e) {
    e.preventDefault();
    var ta = e.target.querySelector('textarea');
    if (!ta.value.trim()) return;
    var el = document.createElement('div');
    el.className = 'msg out';
    el.innerHTML = '<div class="bubble"></div><span class="time">now</span>';
    el.querySelector('.bubble').textContent = ta.value;
    document.getElementById('messages').appendChild(el);
    ta.value = '';
    el.scrollIntoView({ behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
